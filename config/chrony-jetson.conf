# Chrony configuration — Jetson side
#
# Syncs to the host machine (10.42.0.1) via the direct Ethernet link.
# Even without internet NTP, this keeps Jetson and host clocks within
# a few milliseconds of each other, which prevents TF2 "extrapolation
# into the past" errors caused by clock skew.
#
# Usage:
#   sudo cp config/chrony-jetson.conf /etc/chrony/chrony.conf
#   sudo systemctl stop systemd-timesyncd  # avoid conflict
#   sudo systemctl restart chronyd
#
# Or use:  make timesync   (from the host, configures both sides)

# Sync to the host via direct Ethernet.
# minpoll 0 = poll every 1s initially (direct link, low overhead)
# maxpoll 4 = poll every ~16s in steady state (fast enough for drift correction)
server 10.42.0.1 iburst minpoll 0 maxpoll 4

# If the host is unreachable, fall back to the local clock.
# This prevents chrony from giving up entirely.
# NOTE: NTP stratum max is 15; using 10 here (same as host fallback).
local stratum 10

# Allow chronyc from localhost.
cmdallow 127.0.0.1

# Log stats for debugging.
logdir /var/log/chrony

# Standard drift file.
driftfile /var/lib/chrony/drift

# Sync the hardware clock on correction (useful for Jetson).
rtcsync
