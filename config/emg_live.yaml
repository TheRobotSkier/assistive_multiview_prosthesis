# Live EMG tuning config — edit while pipeline is running; changes apply without restart.
# Grace period: a gesture must be sustained continuously for this long before it
# triggers a pipeline action.  A single flicker resets the timer.
gesture_hold_timeout_s: 1.0
# Minimum classifier confidence for POWER (activate / mode toggle) and OPEN (release).
gesture_confidence_threshold: 0.7
release_gesture: 2          # OPEN

# ── EMG grasp adapter configuration ────────────────────────────────────────────
emg_adapter:
  # Gesture aliases: map legacy/raw classifier names → canonical grasp names.
  # The adapter exposes only OPEN, POWER, FLEXION, EXTENSION to the state machine.
  aliases:
    PINCH: FLEXION
    POINT: EXTENSION

  # General confidence threshold for any valid non-neutral gesture.
  confidence_threshold: 0.55

  # Stale-data timeout (seconds).  If no new EMG message arrives within this
  # window the adapter returns a neutral signal.
  stale_timeout_s: 0.5

  # OPEN safety gate.  OPEN is the "release / open hand" command; we require a
  # strong proportional signal and a sustained hold so that spurious classifier
  # flickers cannot accidentally open the hand during grasp.
  open_min_control: 0.7
  open_min_hold_s: 1.0
