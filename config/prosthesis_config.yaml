# ── Central Prosthesis Configuration ──────────────────────────────────────────
# This file serves two purposes:
#   1. ROS2 parameter file — node-namespaced sections (force_controller, pipeline_manager,
#      proximity_controller, twist_propagation) are loaded by the launch files and passed
#      directly to nodes via the ROS2 parameter system.
#   2. Reference — the flat sections (topics, frames, hardware, etc.) are kept for
#      external consumers (test scripts, documentation) that read this file with yaml.safe_load.
#
# When adding new parameters, add them to BOTH the node-namespaced section AND the
# corresponding flat section.

# ═══════════════════════════════════════════════════════════════════════════════
# ROS2 Node Parameter Sections (loaded by launch files)
# ═══════════════════════════════════════════════════════════════════════════════

haptic_controller:
    ros__parameters:
        # Topic names
        pipeline_state_topic: "/pipeline/state"
        # Tuning
        release_buzz_duration_s: 0.5
        release_buzz_intensity: 60.0
        force_max_raw: 500.0
        force_stale_timeout_s: 1.0

command_bridge:
    ros__parameters:
        # Topic names (from controllers)
        thumb_cmd_topic: "/thumb_pos_ff_controller/commands"
        index_cmd_topic: "/index_pos_ff_controller/commands"
        mrl_cmd_topic: "/mrl_pos_ff_controller/commands"
        # Service names (raw Mia Hand driver)
        thumb_traj_service: "joints/thumb/set_trajectory"
        index_traj_service: "joints/index/set_trajectory"
        mrl_traj_service: "joints/mrl/set_trajectory"
        # Joint state bridge
        joint_positions_topic: "data_streams/joints/positions/data"
        joint_states_topic: "/joint_states"
        joint_stream_switch: "data_streams/joints/positions/switch"
        # Trajectory speed/force percentage for set_trajectory calls
        default_speed_percent: 80

force_controller:
    ros__parameters:
        # Topic / service names
        force_data_topic: "data_streams/fingers/forces/data"
        force_stream_switch_service: "data_streams/fingers/forces/switch"
        pipeline_state_topic: "/pipeline/state"
        joint_states_topic: "/joint_states"
        vel_cmd_topic: "/group_vel_ff_controller/commands"
        pos_cmd_topic: "/group_pos_ff_controller/commands"
        force_status_topic: "/force_controller/status"
        manual_adjust_topic: "/force_controller/manual_adjust"
        # Force target
        target_force_min: 50.0
        target_force_max: 200.0
        update_rate_hz: 20.0
        # Stability detection
        stability_window: 1.0
        stability_tolerance: 30.0
        slip_threshold: 100.0
        max_force_emergency: 500.0
        stale_data_timeout_s: 0.5
        force_filter_window: 5
        # Manual volitional adjustment
        manual_adjust_step: 10.0
        # Velocity ramp (closing phase)
        closing_velocity_start: 0.3
        closing_velocity_end: 0.1
        decay_steps: 5
        step_interval_s: 0.2
        stop_positions: [1.5, 1.5, 1.5]
        force_thresholds: [300.0, 300.0, 300.0]
        open_positions: [0.0, 0.0, 0.0]
        relaxed_wait_s: 0.5
        # Force hold (velocity-based deadzone control)
        hold_deadzone: 20.0
        hold_max_velocity: 0.08
        hold_min_overshoot: 20.0
        hold_max_overshoot: 150.0
        emergency_backoff_velocity: -0.1
        force_adjust_rate_up: 15.0
        force_adjust_rate_down: 30.0
        # Joint limits
        joint_position_limits: [3.14, 3.14, 3.14]
        joint_position_min: [0.0, 0.0, 0.0]

pipeline_manager:
    ros__parameters:
        # Topic / service names
        emg_gesture_topic: "/emg/gesture_label"
        emg_confidence_topic: "/emg/confidence"
        grasp_type_topic: "/grasp_preshaping/grasp_type"
        force_status_topic: "/force_controller/status"
        compute_grasp_service: "/grasp_preshaping/compute_grasp"
        twist_activate_service: "/twist_propagation/activate"
        twist_deactivate_service: "/twist_propagation/deactivate"
        pipeline_state_topic: "/pipeline/state"
        pipeline_state_name_topic: "/pipeline/state_name"
        # Twist stop-distance monitoring
        collision_distance_topic: "/twist_propagation/collision_distance"
        twist_hit_detected_topic: "/twist_propagation/hit_detected"
        twist_stop_distance_m: 0.20
        # Tuning
        gesture_hold_timeout_s: 1.0
        gesture_confidence_threshold: 0.7
        release_gesture: 2
        state_publish_rate_hz: 5.0
        # EMG intent relay
        emg_grasp_intent_topic: "/emg_grasp/intent"
        wrist_cmd_topic: "/wrist/set_position"
        wrist_velocity_scale: 45.0
        # Volitional mode control
        volitional_force_adjust_step: 1.0
        volitional_wrist_velocity_scale: 45.0
        volitional_entry_delay_s: 0.5
        # Live config path (empty = disable polling)
        emg_live_config_path: "/prosthesis_ws/config/emg_live.yaml"

proximity_controller:
    ros__parameters:
        # Topic names
        target_closures_topic: "/grasp_preshaping/target_finger_closures"
        wrist_pose_topic: "/grasp_preshaping/wrist_pose"
        target_hand_pose_topic: "/grasp_preshaping/target_hand_pose"
        hand_pose_topic: "/hand_pose"
        pipeline_state_topic: "/pipeline/state"
        thumb_cmd_topic: "/thumb_pos_ff_controller/commands"
        index_cmd_topic: "/index_pos_ff_controller/commands"
        mrl_cmd_topic: "/mrl_pos_ff_controller/commands"
        wrist_cmd_topic: "/wrist/set_position"
        # Tuning
        proximity_enter_threshold_m: 0.08
        proximity_exit_threshold_m: 0.20
        partial_closure_factor: 0.3
        min_closure_amount: 0.1
        wrist_accel_deg_s2: 180.0
        control_rate_hz: 10.0
        # Offset from tracked pose origin (camera) to grasp contact point
        # (fingertips), expressed in the pose's local frame.
        # Same value as twist_propagation's propagation_origin_offset.
        grasp_contact_offset: [0.1543, -0.1485, -0.1352]
        max_valid_proximity_distance_m: 0.75
        max_proximity_step_m: 0.25
        wrist_min_deg: 5.0
        wrist_max_deg: 300.0
        wrist_neutral_deg: 140.0
        max_wrist_delta_deg: 90.0
        command_repeat_period_s: 1.0
        command_epsilon: 0.005
        near_enter_consecutive_samples: 3
        near_exit_consecutive_samples: 3

preshaping_service:
    ros__parameters:
        hand_pose_topic: "/hand_pose"
        hand_twist_topic: "/hand_twist"
        cloud_topic: "/segmentation/object_cloud"
        thumb_cmd_topic: "/thumb_pos_ff_controller/commands"
        index_cmd_topic: "/index_pos_ff_controller/commands"
        mrl_cmd_topic: "/mrl_pos_ff_controller/commands"
        wrist_pose_topic: "/grasp_preshaping/wrist_pose"
        target_hand_pose_topic: "/grasp_preshaping/target_hand_pose"
        target_closures_topic: "/grasp_preshaping/target_finger_closures"
        grasp_type_topic: "/grasp_preshaping/grasp_type"
        compute_service: "/grasp_preshaping/compute_grasp"
        hit_time_topic: "/grasp_preshaping/hit_time"
        camera_lookup_target_frame: "marker_map"
        camera_frames:
            [
                "head_d435i_head_depth_optical_frame",
                "arm_d435i_arm_depth_optical_frame",
            ]
        min_closure_amount: 0.1
        preshaping_closure_fraction: 0.3
        publish_initial_commands: false
        contact_override_max_age_s: 6.0
        max_wrist_delta_deg: 90.0

pointcloud_fusion:
    ros__parameters:
        target_frame: "marker_map"
        cam1_topic: "/head/d435i_head/depth/color/points"
        cam2_topic: "/arm/d435i_arm/depth/color/points"
        arm_frame: "arm_d435i_arm_depth_frame"
        max_distance: 2.0
        voxel_size: 0.005
        bbox_min: [-0.30, -0.10, -0.10]
        bbox_max: [0.22, 0.10, 0.12]
        enable_downsampling: true
        enable_distance_filter: true
        enable_hand_removal: true
        cloud_max_age_s: 0.5
        mounts_config_path: ""
        active_mount: "8_cm_cam_mount"
        # TF wait gate: when true, suppresses cloud processing until
        # marker_map -> *_depth_optical_frame is connected.  Prevents
        # 40-80s of failed TF lookups during OpenVINS startup.
        wait_for_tf: true
        tf_ready_check_interval: 2.0

openvins_odom_tf_relay:
    ros__parameters:
        head_odom_topic: "/ov_msckf/odomimu"
        arm_odom_topic: "/ov_msckf_arm/odomimu"
        target_frame: "marker_map"
        head_imu_frame: "head_imu"
        arm_imu_frame: "arm_imu"
        head_cam_frame: "head_cam0"
        arm_cam_frame: "arm_cam0"
        publish_imu_to_cam_tf: true
        # Kalibr-calibrated imu->cam0 extrinsic from the OpenVINS config on the
        # Jetson.  OpenVINS cam0 == color_optical_frame; the IMU frame used by
        # OpenVINS is already in optical convention (RealSense publishes
        # combined IMU in *_imu_optical_frame).  T_cam_imu is near-identity
        # (~1 deg rotation, ~2-7cm translation).
        #
        # OpenVINS publishes cam0->imu as T_cam_imu.  The relay publishes the
        # inverse direction (imu->cam0).  Since the rotation is near-identity:
        #   T_imu_cam = inv(T_cam_imu)  ≈  (identity rotation, -translation)
        #
        # These values are taken from OpenVINS' live output (cam0 extrinsics)
        # observed on the Jetson during the v12 test:
        #   head (marker-6): T_cam_imu t=[ 0.015,  0.011, -0.066]
        #   arm  (marker-7): T_cam_imu t=[ 0.002,  0.003,  0.007]
        imu_to_cam_x_head: -0.015
        imu_to_cam_y_head: -0.011
        imu_to_cam_z_head: 0.066
        imu_to_cam_roll_head: 0.0
        imu_to_cam_pitch_head: 0.0
        imu_to_cam_yaw_head: 0.0
        imu_to_cam_x_arm: -0.002
        imu_to_cam_y_arm: -0.003
        imu_to_cam_z_arm: -0.007
        imu_to_cam_roll_arm: 0.0
        imu_to_cam_pitch_arm: 0.0
        imu_to_cam_yaw_arm: 0.0
        # When true, the relay attempts to compute live imu->cam0 extrinsics
        # by looking up T(actual_imu, depth_optical) through the RealSense
        # TF chain (not through the hardcoded static TF).  On success, the
        # hardcoded values are overridden.  On failure, the hardcoded values
        # are kept and a warning is logged.
        self_calibrate_extrinsics: false
        self_calibration_max_retries: 100
        # Optional custom topic for receiving live extrinsics from the Jetson
        # (future support).  Leave empty to disable.
        extrinsics_topic: ""
        max_pose_norm_m: 2.0
        max_pose_jump_m: 0.50

openvins_realsense_tf_bridge:
    ros__parameters:
        camera_names: ["head", "arm"]
        parent_frames: ["head_cam0", "arm_cam0"]
        link_frames: ["head_d435i_head_link", "arm_d435i_arm_link"]
        # The color_optical_frame is derived from the link_frame name.
        # Since OpenVINS uses the RealSense color camera as its tracking camera,
        # cam0 == color_optical_frame. The bridge edge cam0->link is just the
        # RealSense static extrinsic T(color_optical -> link).
        anchor_frames:
            [
                "head_d435i_head_color_optical_frame",
                "arm_d435i_arm_color_optical_frame",
            ]
        anchor_frame_modes: ["link", "link"]
        fallback_optical_frames:
            [
                "head_d435i_head_depth_optical_frame",
                "arm_d435i_arm_depth_optical_frame",
            ]
        publish_rate_hz: 10.0
        # Liveness re-sends bridge edges on /tf to work around CycloneDDS
        # /tf_static latch unreliability.  10 Hz ensures the TF buffer always
        # has a fresh entry for the fusion node (15 Hz, 0.5s cloud max age).
        liveness_rate_hz: 10.0
        publish_nominal_static_chain: true

twist_propagation:
    ros__parameters:
        cycle_delay_s: 0.02
        propagation_time_horizon_s: 2.0
        propagation_dt_s: 0.02
        hit_threshold_m: 0.05
        min_points_near_hit: 3
        collision_geometry_radius_m: 0.05
        twist_estimation_window: 5
        # Minimum linear speed (m/s) below which hit detection is suppressed.
        # Prevents false hits when the hand is stationary or drifting near geometry.
        min_twist_linear_mps: 0.02
        # Minimum predicted time-to-hit (s) below which hits are rejected.
        # If the collision is closer than this, the pipeline (~1.4s) cannot
        # complete in time.  Rejecting avoids wasted computation.
        min_time_to_hit_s: 0.4
        active: false
        input_cloud_topic: "/fused_pointcloud"
        segmented_cloud_topic: "/segmentation/object_cloud"
        hand_pose_topic: "/hand_pose"
        odom_topic: ""
        click_positive_topic: "/segmentation/click_positive"
        hand_twist_topic: "/hand_twist"
        hand_twist_input_topic: "/hand_twist"
        external_twist_max_age_s: 2.0
        segmentation_reset_topic: "/segmentation/reset"
        segmentation_retarget_distance_m: 0.10
        compute_grasp_service: "/grasp_preshaping/compute_grasp"
        segmentation_timeout_s: 5.0
        cloud_max_age_s: 2.0
        pose_max_age_s: 1.0
        voxel_leaf_m: 0.02
        max_prediction_covariance_trace: 100.0
        process_noise_linear_mps2_per_s: 0.1
        process_noise_angular_radps2_per_s: 0.5
        enable_covariance_propagation: true
        # Offset from tracked pose origin (camera) to grasp contact point
        # (fingertips), expressed in the pose's local frame.  Applied by
        # rotating by pose orientation before propagation.
        # Computed from camera_mounts.yaml for 8_cm_cam_mount:
        #   cam0 -> link (RealSense extrinsic) -> screw -> palm -> grasp_contact
        propagation_origin_offset: [0.1543, -0.1485, 0.1352]
        preshaping_call_delay_s: 0.15
        background_cycle_enabled: true

# EMG Grasp Controller — state machine gesture interpreter
# Launched when emg:=true (default).
emg_grasp_controller:
    ros__parameters:
        # Gesture label mapping (must match classifier GESTURE_NAMES)
        gesture_rest: 0
        gesture_power: 1
        gesture_flexion: 3
        gesture_extension: 4
        gesture_open: 2
        # Timing
        open_hold_duration_s: 1.0
        open_prop_threshold: 0.7
        power_hold_duration_s: 1.0
        power_rearm_duration_s: 0.3
        stale_timeout_s: 1.0
        # Control scaling
        force_adjust_step: 1.0
        wrist_velocity_scale: 1.0
        update_rate_hz: 20.0
        # Topic names (must match classifier output)
        emg_gesture_topic: "/emg/gesture_label"
        emg_confidence_topic: "/emg/confidence"
        emg_proportional_topic: "/emg/proportional"
        intent_topic: "/emg_grasp/intent"
        mode_topic: "/emg_grasp/mode"

# ═══════════════════════════════════════════════════════════════════════════════
# Flat Reference Sections (used by test scripts and documentation)
# Wrapped under a dummy node to satisfy ROS 2 --params-file parser.
# Test scripts should use yaml.safe_load and access _reference.topics, etc.

_reference:
    ros__parameters:
        # ── ROS Topics ────────────────────────────────────────────────────────
        topics:
            hand_pose: "/hand_pose"
            hand_twist: "/hand_twist"

            # Segmentation
            segmentation_input_cloud: "/segmentation/input_cloud"
            segmentation_click_positive: "/segmentation/click_positive"
            segmentation_click_negative: "/segmentation/click_negative"
            segmentation_reset: "/segmentation/reset"
            segmented_object_cloud: "/segmentation/object_cloud"

            # Grasp preshaping
            compute_grasp_service: "/grasp_preshaping/compute_grasp"
            preshaping_wrist_pose: "/grasp_preshaping/wrist_pose"
            preshaping_target_hand_pose: "/grasp_preshaping/target_hand_pose"
            preshaping_target_closures: "/grasp_preshaping/target_finger_closures"
            preshaping_grasp_type: "/grasp_preshaping/grasp_type"

            # Joint commands (forward position controllers)
            thumb_cmd: "/thumb_pos_ff_controller/commands"
            index_cmd: "/index_pos_ff_controller/commands"
            mrl_cmd: "/mrl_pos_ff_controller/commands"

            # Wrist
            wrist_set_position: "/wrist/set_position"
            wrist_state: "/wrist/state"

            # EMG
            emg_gesture_label: "/emg/gesture_label"
            emg_gesture_name: "/emg/gesture_name"
            emg_confidence: "/emg/confidence"
            emg_proportional: "/emg/proportional"

            # Pipeline
            pipeline_state: "/pipeline/state"
            pipeline_state_name: "/pipeline/state_name"

            # Haptic
            haptic_motors: "/haptic_band/motors"

            # Force
            finger_forces: "data_streams/fingers/forces/data"
            force_stream_switch: "data_streams/fingers/forces/switch"
            force_controller_status: "/force_controller/status"
            joint_states: "/joint_states"

            # Twist Propagation
            twist_activate_service: "/twist_propagation/activate"
            twist_deactivate_service: "/twist_propagation/deactivate"

        # ── TF Frames ─────────────────────────────────────────────────────────
        frames:
            world: "world"
            hand: "hand_link"
            camera_front: "camera_front_depth"
            camera_wrist: "camera_wrist"
            target: "marker_map"
            head_openvins_camera: "head_cam0"
            arm_openvins_camera: "arm_cam0"
            head_realsense_link: "head_d435i_head_link"
            arm_realsense_link: "arm_d435i_arm_link"
            head_depth_optical: "head_d435i_head_depth_optical_frame"
            arm_depth_optical: "arm_d435i_arm_depth_optical_frame"

        # ── Camera TF Bridge ─────────────────────────────────────────────────
        camera_tf_bridge:
            parent_frames: ["head_cam0", "arm_cam0"]
            link_frames: ["head_d435i_head_link", "arm_d435i_arm_link"]
            anchor_frames:
                [
                    "head_d435i_head_color_optical_frame_from_marker",
                    "arm_d435i_arm_color_optical_frame_from_marker",
                ]
            fallback_optical_frames:
                [
                    "head_d435i_head_depth_optical_frame",
                    "arm_d435i_arm_depth_optical_frame",
                ]

        # ── EMG ───────────────────────────────────────────────────────────────
        emg:
            confidence_threshold: 0.8
            gesture_names: ["REST", "POWER", "OPEN", "FLEXION", "EXTENSION"]
            # Gesture to pipeline action mapping
            gesture_actions:
                POWER: "start_grasp"
                OPEN: "release"

        # ── Segmentation ──────────────────────────────────────────────────────
        segmentation:
            inference_url: "http://127.0.0.1:5678"
            cubeedge: 0.05
            roi_radius_m: 0.1

        # ── Grasp Preshaping ─────────────────────────────────────────────────
        preshaping:
            min_closure_amount: 0.1
            preshaping_closure_fraction: 0.3
            publish_initial_commands: false
            camera_lookup_target_frame: "marker_map"
            camera_frames:
                [
                    "head_d435i_head_depth_optical_frame",
                    "arm_d435i_arm_depth_optical_frame",
                ]

        # ── Proximity Execution ──────────────────────────────────────────────
        execution:
            proximity_enter_threshold_m: 0.08
            proximity_exit_threshold_m: 0.20
            partial_closure_factor: 0.3
            min_closure_amount: 0.1
            wrist_accel_deg_s2: 180.0
            control_rate_hz: 10.0
            # Offset from tracked pose origin (camera) to grasp contact point
            grasp_contact_offset: [0.1543, -0.1485, 0.1352]

        # ── Force Control ─────────────────────────────────────────────────────
        force:
            target_force_min: 50.0
            target_force_max: 200.0
            update_rate_hz: 20.0
            stability_window_s: 1.0 # Seconds forces must be stable before declaring HOLDING
            stability_tolerance: 30.0 # Raw sensor units — force must be within this of target
            slip_threshold: 100.0 # Tangential force rate-of-change threshold for slip detection
            emergency_force: 500.0 # Emergency release threshold (raw sensor units)
            stale_data_timeout_s: 0.5 # Seconds without force data before warning
            force_filter_window: 5 # Moving-average window for force readings
            # Velocity ramp (closing phase)
            closing_velocity_start: 0.3 # rad/s — initial closing velocity
            closing_velocity_end: 0.1 # rad/s — minimum closing velocity
            decay_steps: 5
            step_interval_s: 0.2
            relaxed_wait_s: 0.5
            # Contact detection
            stop_positions: [1.5, 1.5, 1.5] # rad — mechanical stop per finger
            force_thresholds: [300.0, 300.0, 300.0] # raw — force contact threshold
            open_positions: [0.0, 0.0, 0.0]
            # Force hold (velocity-based deadzone)
            hold_deadzone: 20.0
            hold_max_velocity: 0.08
            hold_min_overshoot: 20.0
            hold_max_overshoot: 150.0
            emergency_backoff_velocity: -0.1
            force_adjust_rate_up: 15.0
            force_adjust_rate_down: 30.0
            max_current_percent: 60.0 # Safety: max motor current as percentage (0-80)

        # ── Haptic ────────────────────────────────────────────────────────────
        haptic:
            pipeline_state_topic: "/pipeline/state"
            release_buzz_duration_s: 0.5
            release_buzz_intensity: 60.0
            force_max_raw: 500.0
            force_stale_timeout_s: 1.0

        # ── Hardware ──────────────────────────────────────────────────────────
        hardware:
            mia_serial_port: "/dev/ttyMiaHand"
            wrist_port: "/dev/ttyDynamixel"
            wrist_baudrate: 57600
            wrist_motor_id: 1
            haptic_bt_addr1: "84:2E:14:09:E1:4E"

        # ── Twist Propagation ─────────────────────────────────────────────────
        # NOTE: The canonical parameter set is in
        #   src/twist_propagation/config/twist_propagation.yaml
        # This flat section is kept for test scripts and documentation that read this
        # file with yaml.safe_load.  The ROS2 node section above is the source of
        # truth for runtime parameters.
        twist_propagation:
            cycle_delay_s: 0.02
            propagation_time_horizon_s: 2.0
            propagation_dt_s: 0.02
            hit_threshold_m: 0.05
            min_points_near_hit: 3
            collision_geometry_radius_m: 0.05
            twist_estimation_window: 5
            min_twist_linear_mps: 0.02
            min_time_to_hit_s: 0.4
            active: false
            input_cloud_topic: "/fused_pointcloud"
            segmented_cloud_topic: "/segmentation/object_cloud"
            hand_pose_topic: "/hand_pose"
            odom_topic: ""
            click_positive_topic: "/segmentation/click_positive"
            hand_twist_topic: "/hand_twist"
            hand_twist_input_topic: "/hand_twist"
            external_twist_max_age_s: 2.0
            segmentation_reset_topic: "/segmentation/reset"
            segmentation_retarget_distance_m: 0.10
            compute_grasp_service: "/grasp_preshaping/compute_grasp"
            segmentation_timeout_s: 5.0
            cloud_max_age_s: 2.0
            pose_max_age_s: 1.0
            voxel_leaf_m: 0.02
            max_prediction_covariance_trace: 100.0
            process_noise_linear_mps2_per_s: 0.1
            process_noise_angular_radps2_per_s: 0.5
            enable_covariance_propagation: true
            # Offset from tracked pose origin (camera) to grasp contact point
            # (fingertips), expressed in the pose's local frame.
            # Computed from camera_mounts.yaml for 8_cm_cam_mount.
            propagation_origin_offset: [0.1543, -0.1485, 0.1352]

            # ── Multi-click segmentation seeding ────────────────────────────
            # Number of synthetic positive clicks to publish around each collision hit.
            # Total clicks sent = 1 (original hit) + click_count (synthetic).
            # click_count=0 preserves the original single-click behavior.
            click_count: 4
            click_radius_m: 0.03
            click_min_radius_m: 0.005
            click_random_seed: 42

            # Delay between detecting a new segmented cloud and calling the
            # preshaping service (seconds).  Gives the preshaping bridge time to
            # receive the cloud via its own subscription.  Set to 0 to disable.
            preshaping_call_delay_s: 0.15

            # Background warm cache: maintain twist and KDTree while inactive.
            background_cycle_enabled: true
