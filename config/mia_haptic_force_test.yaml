runtime:
  control_rate_hz: 100.0
  csv_rate_hz: 5.0
  haptics_publish_rate_hz: 10.0
  terminal_rate_hz: 4.0
  startup_controller_timeout_s: 30.0
  status_publish_period_s: 1.0
  complete_shutdown_delay_s: 0.2
topics:
  joint_states: /joint_states
  force_data: data_streams/fingers/forces/data
  motor_positions: data_streams/motors/positions/data
  motor_speeds: data_streams/motors/speeds/data
  motor_currents: data_streams/motors/currents/data
  joint_positions: data_streams/joints/positions/data
  joint_speeds: data_streams/joints/speeds/data
  emg_gesture_label: /emg/gesture_label
  emg_gesture_name: /emg/gesture_name
  emg_confidence: /emg/confidence
  emg_proportional: /emg/proportional
  hand_velocity_commands: /group_vel_ff_controller/commands
  hand_position_commands: /group_pos_ff_controller/commands
  wrist_state: /wrist/state
  wrist_command: /wrist/set_position
  haptic_motors: /haptic_band/motors
  test_state: /mia_haptic_force_test/state
  test_status: /mia_haptic_force_test/status
emg:
  rest_label: 0
  activation_label: 1
  wrist_toggle_label: 1
  open_label: 2
  increase_force_label: 3
  decrease_force_label: 4
  wrist_positive_label: 3
  wrist_negative_label: 4
  confidence_threshold: 0.55
  activation_hold_s: 0.2
  open_hold_s: 1.0
  open_proportional_threshold: 0.5
  power_toggle_hold_s: 0.5
  power_rearm_s: 0.4
  stale_timeout_s: 1.0
hand:
  open_positions:
    j_thumb_fle: 0.0
    j_index_fle: 0.0
    j_mrl_fle: 0.0
  max_closure_positions:
    j_thumb_fle: 1.5
    j_index_fle: 1.5
    j_mrl_fle: 1.5
  open_position_tolerance_rad: 0.08
  opening_min_s: 0.5
  opening_timeout_s: 4.0
  closing_velocity_start_rad_s: 0.3
  closing_velocity_end_rad_s: 0.1
  closing_decay_steps: 5
  closing_step_interval_s: 0.2
  hold_deadzone: 20.0
  hold_min_overshoot: 20.0
  hold_max_overshoot: 150.0
  hold_max_velocity_rad_s: 0.08
force:
  contact_thresholds:
    j_thumb_fle: 300.0
    j_index_fle: 300.0
    j_mrl_fle: 300.0
  initial_hold_targets:
    j_thumb_fle: 300.0
    j_index_fle: 300.0
    j_mrl_fle: 300.0
  target_min: 50.0
  target_max: 500.0
  adjustment_rate_up: 100.0
  adjustment_rate_down: 200.0
  emergency_threshold: 800.0
  emergency_backoff_velocity_rad_s: -0.1
  stale_timeout_s: 1.0
  require_force_data: true
  haptic_percent_source: measured_average
wrist:
  enabled: true
  horizontal_deg: 180.0
  vertical_deg: 90.0
  min_deg: 5.0
  max_deg: 300.0
  acceleration_deg_s2: 180.0
  control_velocity_deg_s: 45.0
  position_tolerance_deg: 4.0
  move_timeout_s: 8.0
  settle_s: 0.2
  stale_timeout_s: 1.0
  assume_target_on_timeout: true
  return_after_open_delay_s: 3.0
  vertical_delay_s: 3.0
haptics:
  enabled: true
  motor_count: 8
  publish_zero_when_idle: true
  event_motor_indices:
  - 0
  - 1
  - 2
  - 3
  - 4
  - 5
  - 6
  - 7
  activation_buzz_duration_s: 0.12
  activation_buzz_intensity_pct: 12.0
  closure_start_buzz_duration_s: 0.15
  closure_start_buzz_intensity_pct: 22.0
  contact_buzz_duration_s: 0.2
  contact_buzz_intensity_pct: 35.0
  wrist_motor_angles_deg:
  - 0.0
  - 45.0
  - 90.0
  - 135.0
  - 180.0
  - 225.0
  - 270.0
  - 315.0
  wrist_thumb_offset_deg: 0.0
  wrist_intensity_pct: 45.0
  wrist_min_motor_pct: 3.0
  force_min_grasp_force: 50.0
  force_max_grasp_force: 500.0
  force_phase_change_threshold_pct: 40.0
  force_motor_step_pct: 5.0
  force_low_intensity_pct: 18.0
  force_high_intensity_pct: 85.0
  force_motor_order:
  - 0
  - 1
  - 2
  - 3
  - 4
  - 5
  - 6
  - 7
logging:
  output_dir: /app/data/mia_haptic_force_test
  run_name_prefix: mia_haptic_force_test
  samples_csv: samples.csv
  events_csv: events.csv
  config_snapshot_yaml: config_snapshot.yaml
  flush_every_rows: 1
