# Chrony configuration — host side
#
# This machine (10.42.0.1) acts as the NTP source for the Jetson (10.42.0.2).
# Even without internet NTP access, chrony keeps the two machines in sync
# with each other via the direct Ethernet link.
#
# Usage:
#   sudo cp config/chrony-host.conf /etc/chrony/chrony.conf
#   sudo systemctl stop systemd-timesyncd  # avoid conflict
#   sudo systemctl restart chronyd
#
# Then on the Jetson:
#   sudo cp config/chrony-jetson.conf /etc/chrony/chrony.conf
#   sudo systemctl restart chronyd
#
# Or use:  make timesync

# Bind to all interfaces so the Jetson can reach us via 10.42.0.1.
# On WSL2 mirrored networking, chrony may default to 127.0.0.1 only.
bindaddress 0.0.0.0

# Use the system RTC as the local reference (no internet needed).
# stratum 10 means "not very authoritative, but better than nothing".
# This also makes chrony serve time even without an upstream NTP source.
local stratum 10

# Allow the Jetson to query this server.
allow 10.42.0.0/24

# Log stats for debugging.
logdir /var/log/chrony

# Standard drift file.
driftfile /var/lib/chrony/drift

# Allow chronyc from localhost and from the Jetson subnet.
cmdallow 127.0.0.1
cmdallow 10.42.0.0/24
