# Docker Compose GPU override
# Use with: docker-compose -f docker-compose.yml -f docker-compose.gpu.yml up

services:
  ros:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
