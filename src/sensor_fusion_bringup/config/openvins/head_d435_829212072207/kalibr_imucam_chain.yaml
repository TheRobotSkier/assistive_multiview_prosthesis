%YAML:1.0
# Camera-IMU calibration for Intel RealSense D435 (serial 829212072207) at HEAD mount.
# Copied from arm_d435_829212072207 calibration (same physical camera, different mount).
# T_cam_imu is a manual estimate (near-identity) — external GY-91 IMU, not Kalibr-calibrated.
# IMU topic: /head/d435i_head/imu (external GY-91 module)
# rostopic updated from /arm/d435_arm to /head/d435i_head to match cameras container naming.

cam0:
  T_cam_imu:
    - [1.0, 0.0, 0.0, 0.020]
    - [0.0, 1.0, 0.0, -0.005]
    - [0.0, 0.0, 1.0, -0.010]
    - [0.0, 0.0, 0.0, 1.0]
  cam_overlaps: []
  camera_model: pinhole
  distortion_coeffs: [0.10660040555500379, -0.19725984022276483, -0.0017422990584042355, 0.0022020513377890858]
  distortion_model: radtan
  intrinsics: [599.0144910569156, 599.5793593987496, 330.4358247492389, 244.51650425749176]
  resolution: [640, 480]
  rostopic: /head/d435i_head/color/image_raw
  timeshift_cam_imu: 0.0
