    12_cm_V_cam_mount:
        description: Camera mounted 12 cm above hand, vertical orientation
        screw_to_palm:
            translation:
                x: 0.01585
                y: -0.091762
                z: 0.200955
            orientation_desc: palm x = screw -z,  palm y = screw x,  palm z = screw -y
            quaternion:
