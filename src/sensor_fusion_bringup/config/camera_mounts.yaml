# ============================================================
# D435i Camera Mount Configuration
# ============================================================
#
# Stores transforms for different D435i camera mounts on the
# prosthesis, plus the workspace bounding box definition.
#
# Frame conventions:
#   - bottom_screw_frame:  D435i tripod mount hole (center of
#     bottom face). X=forward (lens pointing direction),
#     Y=left, Z=up.
#   - camera_link:         D435i camera body origin.
#   - palm_frame:          Mia hand base frame.
#   - bounding_box_*:      Workspace bounding box in palm_frame.
#
# All translations in METERS.
# Quaternions in ROS convention: [x, y, z, w].
#
# Transform chain:
#   bottom_screw_frame -> camera_link (URDF, fixed)
#   bottom_screw_frame -> palm_frame   (mount-specific, below)
#   palm_frame -> bounding_box         (workspace, below)
#   palm_frame -> grasp_contact        (grasp contact point, below)
#   screw_frame -> bbcam1/bbcam2       (camera body pruning box, below)
# ============================================================

screw_to_link:
    translation:
        x: 0.0106
        y: 0.0175
        z: 0.0125
    rotation: identity
    quaternion:
        - 0.0
        - 0.0
        - 0.0
        - 1.0

bounding_box:
    palm_to_corner:
        translation:
            x: 0.11
            y: 0.205
            z: 0.11
        rotation: identity
        quaternion:
            - 0.0
            - 0.0
            - 0.0
            - 1.0
    corner_to_opposite:
        translation:
            x: -0.22
            y: -0.34
            z: -0.42
        rotation: identity
        quaternion:
            - 0.0
            - 0.0
            - 0.0
            - 1.0

grasp_contact:
    palm_to_grasp_contact:
        translation:
            x: 0.0
            y: 0.13
            z: 0.03
        rotation: identity
        quaternion:
            - 0.0
            - 0.0
            - 0.0
            - 1.0

cam_bounding_box_8cm:
    screw_to_bbcam1:
        translation:
            x: 0.05
            y: 0.05
            z: 0.14
        rotation: identity
        quaternion:
            - 0.0
            - 0.0
            - 0.0
            - 1.0
    screw_to_bbcam2:
        translation:
            x: -0.035
            y: -0.10
            z: -0.04
        rotation: identity
        quaternion:
            - 0.0
            - 0.0
            - 0.0
            - 1.0

mounts:
    5_cm_cam_mount:
        description: Camera mounted 5 cm above hand, vertical orientation
        screw_to_palm:
            translation:
                x: 0.01585
                y: -0.091762
                z: 0.130955
            orientation_desc: palm x = screw -z,  palm y = screw x,  palm z = screw -y
            quaternion:
                - -0.5
                - -0.5
                - 0.5
                - -0.5
    8_cm_cam_mount:
        description: Camera mounted 8 cm above hand, vertical orientation
        screw_to_palm:
            translation:
                x: 0.01585
                y: -0.091762
                z: 0.160955
            orientation_desc: palm x = screw -z,  palm y = screw x,  palm z = screw -y
            quaternion:
                - -0.5
                - -0.5
                - 0.5
                - -0.5
    10_cm_cam_mount:
