   <g id="text_1">
    <text style="font-weight: 700; font-size: 11.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #2563eb" x="44.28" y="62.040693" transform="rotate(-0 44.28 62.040693)">O(1) proximity lookup</text>
   </g>
   <g id="text_2">
    <text style="font-size: 9.2px; font-family: 'DejaVu Sans'; fill: #333333" transform="translate(44.28 83.057575)">Distance to the surface is a direct voxel query, turning expensive collision checks into array</text>
    <text style="font-size: 9.2px; font-family: 'DejaVu Sans'; fill: #333333" transform="translate(44.28 93.359563)">reads along the finger-closure path.</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 11.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #dc2626" x="44.28" y="106.669893" transform="rotate(-0 44.28 106.669893)">Narrow-band truncation</text>
   </g>
   <g id="text_4">
    <text style="font-size: 9.2px; font-family: 'DejaVu Sans'; fill: #333333" transform="translate(44.28 127.686775)">Only voxels within a few cells of the surface are stored, bounding memory and compute to</text>
    <text style="font-size: 9.2px; font-family: 'DejaVu Sans'; fill: #333333" transform="translate(44.28 137.988763)">exactly the band fingers interact with.</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 11.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #0284c7" x="44.28" y="151.299093" transform="rotate(-0 44.28 151.299093)">Free signed inside/outside</text>
   </g>
   <g id="text_6">
    <text style="font-size: 9.2px; font-family: 'DejaVu Sans'; fill: #333333" transform="translate(44.28 172.315975)">The sign separates object interior from free space, so the optimiser knows whether a contact</text>
    <text style="font-size: 9.2px; font-family: 'DejaVu Sans'; fill: #333333" transform="translate(44.28 182.617963)">penetrated the surface.</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 11.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #6b7280" x="44.28" y="195.928292" transform="rotate(-0 44.28 195.928292)">Analytic surface normals</text>
   </g>
   <g id="text_8">
    <text style="font-size: 9.2px; font-family: 'DejaVu Sans'; fill: #333333" transform="translate(44.28 216.945175)">The field gradient yields per-voxel normals used directly for the alignment and wrench-proxy</text>
    <text style="font-size: 9.2px; font-family: 'DejaVu Sans'; fill: #333333" transform="translate(44.28 227.247163)">grasp scores.</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 11.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #2563eb" x="44.28" y="240.557492" transform="rotate(-0 44.28 240.557492)">Backside completion</text>
   </g>
   <g id="text_10">
    <text style="font-size: 9.2px; font-family: 'DejaVu Sans'; fill: #333333" transform="translate(44.28 261.574375)">Superquadric geometry fills the unobserved backside, giving a stable closure target even from a</text>
    <text style="font-size: 9.2px; font-family: 'DejaVu Sans'; fill: #333333" transform="translate(44.28 271.876363)">single viewpoint.</text>
   </g>
   <g id="text_11">
    <text style="font-weight: 700; font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #111827" x="220.05" y="21.437813" transform="rotate(-0 220.05 21.437813)">Why a TSDF for grasp preshaping?</text>
   </g>
  </g>
 </g>
