<?xml version="1.0"?>
<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.0//EN" "http://www.w3.org/TR/2001/REC-SVG-20010904/DTD/svg10.dtd">
<svg xmlns="http://www.w3.org/2000/svg" width="596" height="367" viewBox="0 0 596 367">
<text x="12" y="18" font-family="DejaVu Sans" font-size="15" font-weight="bold" fill="#111827">Loading and querying the finger-contact LUT (Rust)</text>
<g font-family="monospace" font-size="14px">
<text x="0" y="14" xml:space="preserve"><tspan fill="#008000" font-weight="bold">use</tspan><tspan fill="#bbbbbb">&#160;</tspan>grasp_preshaping::lut_helper::{Contact,<tspan fill="#bbbbbb">&#160;</tspan>FingerLUT};<tspan fill="#bbbbbb"></tspan></text>
<text x="0" y="33" xml:space="preserve"><tspan fill="#bbbbbb"></tspan><tspan fill="#bbbbbb"></tspan></text>
<text x="0" y="52" xml:space="preserve"><tspan fill="#bbbbbb"></tspan><tspan fill="#008000" font-weight="bold">fn</tspan><tspan fill="#bbbbbb">&#160;</tspan><tspan fill="#0000FF">main</tspan>()<tspan fill="#bbbbbb">&#160;</tspan>{<tspan fill="#bbbbbb"></tspan></text>
<text x="0" y="71" xml:space="preserve"><tspan fill="#bbbbbb"></tspan><tspan fill="#bbbbbb">&#160;&#160;&#160;&#160;</tspan><tspan fill="#3D7B7B" font-style="italic">//&#160;Load&#160;the&#160;precomputed&#160;finger-closure&#160;LUT&#160;(.npz&#160;of&#160;dual&#160;quaternions).</tspan></text>
<text x="0" y="90" xml:space="preserve"><tspan fill="#3D7B7B" font-style="italic"></tspan><tspan fill="#bbbbbb">&#160;&#160;&#160;&#160;</tspan><tspan fill="#3D7B7B" font-style="italic">//&#160;Each&#160;contact&#160;stores&#160;an&#160;SE(3)&#160;transform&#160;per&#160;closure&#160;step,&#160;so&#160;runtime</tspan></text>
<text x="0" y="109" xml:space="preserve"><tspan fill="#3D7B7B" font-style="italic"></tspan><tspan fill="#bbbbbb">&#160;&#160;&#160;&#160;</tspan><tspan fill="#3D7B7B" font-style="italic">//&#160;collision&#160;detection&#160;is&#160;just&#160;array&#160;lookups&#160;against&#160;the&#160;TSDF.</tspan></text>
<text x="0" y="128" xml:space="preserve"><tspan fill="#3D7B7B" font-style="italic"></tspan><tspan fill="#bbbbbb">&#160;&#160;&#160;&#160;</tspan><tspan fill="#008000" font-weight="bold">let</tspan><tspan fill="#bbbbbb">&#160;</tspan>lut<tspan fill="#bbbbbb">&#160;</tspan><tspan fill="#666666">=</tspan><tspan fill="#bbbbbb">&#160;</tspan>FingerLUT::load(<tspan fill="#BA2121">&quot;</tspan><tspan fill="#BA2121">data/finger_contact_lut.npz</tspan><tspan fill="#BA2121">&quot;</tspan>);<tspan fill="#bbbbbb"></tspan></text>
<text x="0" y="147" xml:space="preserve"><tspan fill="#bbbbbb"></tspan><tspan fill="#bbbbbb"></tspan></text>
<text x="0" y="166" xml:space="preserve"><tspan fill="#bbbbbb"></tspan><tspan fill="#bbbbbb">&#160;&#160;&#160;&#160;</tspan><tspan fill="#3D7B7B" font-style="italic">//&#160;Control&#160;value&#160;in&#160;[0,&#160;1]&#160;along&#160;the&#160;closure&#160;path&#160;(0&#160;=&#160;open,&#160;1&#160;=&#160;closed).</tspan></text>
<text x="0" y="185" xml:space="preserve"><tspan fill="#3D7B7B" font-style="italic"></tspan><tspan fill="#bbbbbb">&#160;&#160;&#160;&#160;</tspan><tspan fill="#008000" font-weight="bold">let</tspan><tspan fill="#bbbbbb">&#160;</tspan>control<tspan fill="#bbbbbb">&#160;</tspan><tspan fill="#666666">=</tspan><tspan fill="#bbbbbb">&#160;</tspan><tspan fill="#666666">0.6</tspan>;<tspan fill="#bbbbbb"></tspan></text>
<text x="0" y="204" xml:space="preserve"><tspan fill="#bbbbbb"></tspan><tspan fill="#bbbbbb"></tspan></text>
<text x="0" y="223" xml:space="preserve"><tspan fill="#bbbbbb"></tspan><tspan fill="#bbbbbb">&#160;&#160;&#160;&#160;</tspan><tspan fill="#3D7B7B" font-style="italic">//&#160;World&#160;transform&#160;of&#160;the&#160;index&#160;fingertip&#160;at&#160;this&#160;closure&#160;step.</tspan></text>
<text x="0" y="242" xml:space="preserve"><tspan fill="#3D7B7B" font-style="italic"></tspan><tspan fill="#bbbbbb">&#160;&#160;&#160;&#160;</tspan><tspan fill="#008000" font-weight="bold">let</tspan><tspan fill="#bbbbbb">&#160;</tspan>se3<tspan fill="#bbbbbb">&#160;</tspan><tspan fill="#666666">=</tspan><tspan fill="#bbbbbb">&#160;</tspan>lut.get_se_transform(Contact::IndexTip,<tspan fill="#bbbbbb">&#160;</tspan>control);<tspan fill="#bbbbbb"></tspan></text>
<text x="0" y="261" xml:space="preserve"><tspan fill="#bbbbbb"></tspan><tspan fill="#bbbbbb">&#160;&#160;&#160;&#160;</tspan><tspan fill="#008000" font-weight="bold">let</tspan><tspan fill="#bbbbbb">&#160;</tspan>location<tspan fill="#bbbbbb">&#160;</tspan><tspan fill="#666666">=</tspan><tspan fill="#bbbbbb">&#160;</tspan>lut.get_location(Contact::IndexTip,<tspan fill="#bbbbbb">&#160;</tspan>control);<tspan fill="#bbbbbb"></tspan></text>
<text x="0" y="280" xml:space="preserve"><tspan fill="#bbbbbb"></tspan><tspan fill="#bbbbbb"></tspan></text>
<text x="0" y="299" xml:space="preserve"><tspan fill="#bbbbbb"></tspan><tspan fill="#bbbbbb">&#160;&#160;&#160;&#160;</tspan><tspan fill="#0000FF">println!</tspan>(<tspan fill="#BA2121">&quot;</tspan><tspan fill="#BA2121">IndexTip&#160;@&#160;{:.2}:&#160;pos&#160;=&#160;[{:.3},&#160;{:.3},&#160;{:.3}]</tspan><tspan fill="#BA2121">&quot;</tspan>,<tspan fill="#bbbbbb"></tspan></text>
<text x="0" y="318" xml:space="preserve"><tspan fill="#bbbbbb"></tspan><tspan fill="#bbbbbb">&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;</tspan>control,<tspan fill="#bbbbbb">&#160;</tspan>location.x,<tspan fill="#bbbbbb">&#160;</tspan>location.y,<tspan fill="#bbbbbb">&#160;</tspan>location.z);<tspan fill="#bbbbbb"></tspan></text>
<text x="0" y="337" xml:space="preserve"><tspan fill="#bbbbbb"></tspan><tspan fill="#bbbbbb">&#160;&#160;&#160;&#160;</tspan><tspan fill="#3D7B7B" font-style="italic">//&#160;se3&#160;is&#160;a&#160;4x4&#160;nalgebra&#160;Matrix4&lt;f64&gt;&#160;(rotation&#160;+&#160;translation).</tspan></text>
<text x="0" y="356" xml:space="preserve"><tspan fill="#3D7B7B" font-style="italic"></tspan><tspan fill="#bbbbbb">&#160;&#160;&#160;&#160;</tspan><tspan fill="#008000" font-weight="bold">let</tspan><tspan fill="#bbbbbb">&#160;</tspan>_rotation<tspan fill="#bbbbbb">&#160;</tspan><tspan fill="#666666">=</tspan><tspan fill="#bbbbbb">&#160;</tspan>se3.fixed_view::<tspan fill="#666666">&lt;</tspan><tspan fill="#666666">3</tspan>,<tspan fill="#bbbbbb">&#160;</tspan><tspan fill="#666666">3</tspan><tspan fill="#666666">&gt;</tspan>(<tspan fill="#666666">0</tspan>,<tspan fill="#bbbbbb">&#160;</tspan><tspan fill="#666666">0</tspan>);<tspan fill="#bbbbbb"></tspan></text>
<text x="0" y="375" xml:space="preserve"><tspan fill="#bbbbbb"></tspan>}<tspan fill="#bbbbbb"></tspan></text>
<text x="0" y="394" xml:space="preserve"><tspan fill="#bbbbbb"></tspan></text></g></svg>
