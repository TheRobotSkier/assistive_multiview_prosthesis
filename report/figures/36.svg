<?xml version="1.0"?>
<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.0//EN" "http://www.w3.org/TR/2001/REC-SVG-20010904/DTD/svg10.dtd">
<svg xmlns="http://www.w3.org/2000/svg" width="661" height="599" viewBox="0 0 661 599">
<text x="14" y="20" font-family="DejaVu Sans" font-size="17" font-weight="bold" fill="#111827">Loading the LUT and choosing the grasp type (Rust)</text>
<g font-family="monospace" font-size="14px" transform="translate(0 38)">
<text x="0" y="14" xml:space="preserve"><tspan fill="#008000" font-weight="bold">use</tspan><tspan fill="#bbbbbb">&#160;</tspan>grasp_preshaping::lut_helper::{Contact,<tspan fill="#bbbbbb">&#160;</tspan>FingerLUT};<tspan fill="#bbbbbb"></tspan></text>
<text x="0" y="33" xml:space="preserve"><tspan fill="#bbbbbb"></tspan><tspan fill="#bbbbbb"></tspan></text>
<text x="0" y="52" xml:space="preserve"><tspan fill="#bbbbbb"></tspan><tspan fill="#3D7B7B" font-style="italic">//&#160;Load&#160;the&#160;precomputed&#160;finger-closure&#160;LUT&#160;(.npz&#160;of&#160;dual&#160;quaternions).</tspan></text>
<text x="0" y="71" xml:space="preserve"><tspan fill="#3D7B7B" font-style="italic"></tspan><tspan fill="#3D7B7B" font-style="italic">//&#160;Each&#160;contact&#160;stores&#160;an&#160;SE(3)&#160;transform&#160;per&#160;closure&#160;step,&#160;so&#160;runtime</tspan></text>
<text x="0" y="90" xml:space="preserve"><tspan fill="#3D7B7B" font-style="italic"></tspan><tspan fill="#3D7B7B" font-style="italic">//&#160;collision&#160;detection&#160;is&#160;just&#160;array&#160;lookups&#160;against&#160;the&#160;TSDF.</tspan></text>
<text x="0" y="109" xml:space="preserve"><tspan fill="#3D7B7B" font-style="italic"></tspan><tspan fill="#008000" font-weight="bold">let</tspan><tspan fill="#bbbbbb">&#160;</tspan>lut<tspan fill="#bbbbbb">&#160;</tspan><tspan fill="#666666">=</tspan><tspan fill="#bbbbbb">&#160;</tspan>FingerLUT::load(<tspan fill="#BA2121">&quot;</tspan><tspan fill="#BA2121">data/finger_contact_lut.npz</tspan><tspan fill="#BA2121">&quot;</tspan>);<tspan fill="#bbbbbb"></tspan></text>
<text x="0" y="128" xml:space="preserve"><tspan fill="#bbbbbb"></tspan><tspan fill="#bbbbbb"></tspan></text>
<text x="0" y="147" xml:space="preserve"><tspan fill="#bbbbbb"></tspan><tspan fill="#3D7B7B" font-style="italic">//&#160;---&#160;How&#160;the&#160;grasp&#160;type&#160;is&#160;chosen&#160;-------------------------------------</tspan></text>
<text x="0" y="166" xml:space="preserve"><tspan fill="#3D7B7B" font-style="italic"></tspan><tspan fill="#3D7B7B" font-style="italic">//&#160;Every&#160;search&#160;particle&#160;carries&#160;a&#160;grasp_type&#160;in&#160;{0,1,2}:</tspan></text>
<text x="0" y="185" xml:space="preserve"><tspan fill="#3D7B7B" font-style="italic"></tspan><tspan fill="#3D7B7B" font-style="italic">//&#160;&#160;&#160;0&#160;=&#160;Cylindrical,&#160;1&#160;=&#160;Pinch,&#160;2&#160;=&#160;Lateral.</tspan></text>
<text x="0" y="204" xml:space="preserve"><tspan fill="#3D7B7B" font-style="italic"></tspan><tspan fill="#3D7B7B" font-style="italic">//&#160;Iteration&#160;0&#160;assigns&#160;it&#160;uniformly&#160;at&#160;random;&#160;later&#160;iterations&#160;either</tspan></text>
<text x="0" y="223" xml:space="preserve"><tspan fill="#3D7B7B" font-style="italic"></tspan><tspan fill="#3D7B7B" font-style="italic">//&#160;inherit&#160;the&#160;parent&#160;elite&#39;s&#160;type&#160;(90%&#160;of&#160;the&#160;time)&#160;or&#160;mutate&#160;(10%)</tspan></text>
<text x="0" y="242" xml:space="preserve"><tspan fill="#3D7B7B" font-style="italic"></tspan><tspan fill="#3D7B7B" font-style="italic">//&#160;to&#160;a&#160;score-weighted&#160;distribution.&#160;After&#160;the&#160;last&#160;iteration&#160;the&#160;single</tspan></text>
<text x="0" y="261" xml:space="preserve"><tspan fill="#3D7B7B" font-style="italic"></tspan><tspan fill="#3D7B7B" font-style="italic">//&#160;highest-scoring&#160;particle&#160;wins,&#160;and&#160;its&#160;grasp_type&#160;is&#160;the&#160;chosen&#160;grasp.</tspan></text>
<text x="0" y="280" xml:space="preserve"><tspan fill="#3D7B7B" font-style="italic"></tspan><tspan fill="#3D7B7B" font-style="italic">//</tspan></text>
<text x="0" y="299" xml:space="preserve"><tspan fill="#3D7B7B" font-style="italic"></tspan><tspan fill="#3D7B7B" font-style="italic">//&#160;The&#160;chosen&#160;type&#160;selects&#160;a&#160;different&#160;contact&#160;set,&#160;thumb&#160;mode,&#160;and&#160;a</tspan></text>
<text x="0" y="318" xml:space="preserve"><tspan fill="#3D7B7B" font-style="italic"></tspan><tspan fill="#3D7B7B" font-style="italic">//&#160;per-type&#160;maximum&#160;closure&#160;(the&#160;LUT&#160;stores&#160;the&#160;self-collision&#160;limit):</tspan></text>
<text x="0" y="337" xml:space="preserve"><tspan fill="#3D7B7B" font-style="italic"></tspan><tspan fill="#008000" font-weight="bold">let</tspan><tspan fill="#bbbbbb">&#160;</tspan>max_closure<tspan fill="#bbbbbb">&#160;</tspan><tspan fill="#666666">=</tspan><tspan fill="#bbbbbb">&#160;</tspan>lut.get_max_closure(chosen_grasp_type);<tspan fill="#bbbbbb">&#160;</tspan><tspan fill="#3D7B7B" font-style="italic">//&#160;0,&#160;1,&#160;or&#160;2</tspan></text>
<text x="0" y="356" xml:space="preserve"><tspan fill="#3D7B7B" font-style="italic"></tspan><tspan fill="#bbbbbb"></tspan></text>
<text x="0" y="375" xml:space="preserve"><tspan fill="#bbbbbb"></tspan><tspan fill="#3D7B7B" font-style="italic">//&#160;Control&#160;value&#160;in&#160;[0,&#160;max_closure]&#160;along&#160;the&#160;closure&#160;path.</tspan></text>
<text x="0" y="394" xml:space="preserve"><tspan fill="#3D7B7B" font-style="italic"></tspan><tspan fill="#008000" font-weight="bold">let</tspan><tspan fill="#bbbbbb">&#160;</tspan>control<tspan fill="#bbbbbb">&#160;</tspan><tspan fill="#666666">=</tspan><tspan fill="#bbbbbb">&#160;</tspan><tspan fill="#666666">0.6</tspan><tspan fill="#bbbbbb">&#160;</tspan><tspan fill="#666666">*</tspan><tspan fill="#bbbbbb">&#160;</tspan>max_closure;<tspan fill="#bbbbbb"></tspan></text>
<text x="0" y="413" xml:space="preserve"><tspan fill="#bbbbbb"></tspan><tspan fill="#bbbbbb"></tspan></text>
<text x="0" y="432" xml:space="preserve"><tspan fill="#bbbbbb"></tspan><tspan fill="#3D7B7B" font-style="italic">//&#160;World&#160;transform&#160;of&#160;the&#160;index&#160;fingertip&#160;at&#160;this&#160;closure&#160;step.</tspan></text>
<text x="0" y="451" xml:space="preserve"><tspan fill="#3D7B7B" font-style="italic"></tspan><tspan fill="#008000" font-weight="bold">let</tspan><tspan fill="#bbbbbb">&#160;</tspan>se3<tspan fill="#bbbbbb">&#160;</tspan><tspan fill="#666666">=</tspan><tspan fill="#bbbbbb">&#160;</tspan>lut.get_se_transform(Contact::IndexTip,<tspan fill="#bbbbbb">&#160;</tspan>control);<tspan fill="#bbbbbb"></tspan></text>
<text x="0" y="470" xml:space="preserve"><tspan fill="#bbbbbb"></tspan><tspan fill="#008000" font-weight="bold">let</tspan><tspan fill="#bbbbbb">&#160;</tspan>location<tspan fill="#bbbbbb">&#160;</tspan><tspan fill="#666666">=</tspan><tspan fill="#bbbbbb">&#160;</tspan>lut.get_location(Contact::IndexTip,<tspan fill="#bbbbbb">&#160;</tspan>control);<tspan fill="#bbbbbb"></tspan></text>
<text x="0" y="489" xml:space="preserve"><tspan fill="#bbbbbb"></tspan><tspan fill="#bbbbbb"></tspan></text>
<text x="0" y="508" xml:space="preserve"><tspan fill="#bbbbbb"></tspan><tspan fill="#0000FF">println!</tspan>(<tspan fill="#BA2121">&quot;</tspan><tspan fill="#BA2121">IndexTip&#160;@&#160;{:.2}:&#160;pos&#160;=&#160;[{:.3},&#160;{:.3},&#160;{:.3}]</tspan><tspan fill="#BA2121">&quot;</tspan>,<tspan fill="#bbbbbb"></tspan></text>
<text x="0" y="527" xml:space="preserve"><tspan fill="#bbbbbb"></tspan><tspan fill="#bbbbbb">&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;</tspan>control,<tspan fill="#bbbbbb">&#160;</tspan>location.x,<tspan fill="#bbbbbb">&#160;</tspan>location.y,<tspan fill="#bbbbbb">&#160;</tspan>location.z);<tspan fill="#bbbbbb"></tspan></text>
<text x="0" y="546" xml:space="preserve"><tspan fill="#bbbbbb"></tspan></text></g></svg>
