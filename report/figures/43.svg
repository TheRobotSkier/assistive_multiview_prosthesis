<?xml version="1.0"?>
<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.0//EN" "http://www.w3.org/TR/2001/REC-SVG-20010904/DTD/svg10.dtd">
<svg xmlns="http://www.w3.org/2000/svg" width="705" height="466" viewBox="0 0 705 466">
<text x="14" y="20" font-family="DejaVu Sans" font-size="17" font-weight="bold" fill="#111827">Alignment and wrench-proxy scoring (Rust)</text>
<g font-family="monospace" font-size="14px" transform="translate(0 38)">
<text x="0" y="14" xml:space="preserve"><tspan fill="#3D7B7B" font-style="italic">//&#160;Grasp&#160;scoring:&#160;geometric&#160;alignment&#160;and&#160;wrench&#160;(force-closure)&#160;proxy.</tspan></text>
<text x="0" y="33" xml:space="preserve"><tspan fill="#3D7B7B" font-style="italic"></tspan><tspan fill="#3D7B7B" font-style="italic">//&#160;Source:&#160;src/grasp_preshaping/src/planner.rs</tspan></text>
<text x="0" y="52" xml:space="preserve"><tspan fill="#3D7B7B" font-style="italic"></tspan><tspan fill="#bbbbbb"></tspan></text>
<text x="0" y="71" xml:space="preserve"><tspan fill="#bbbbbb"></tspan><tspan fill="#3D7B7B" font-style="italic">//&#160;Alignment:&#160;how&#160;well&#160;each&#160;finger&#39;s&#160;closure&#160;force&#160;opposes&#160;the&#160;surface&#160;normal.</tspan></text>
<text x="0" y="90" xml:space="preserve"><tspan fill="#3D7B7B" font-style="italic"></tspan><tspan fill="#3D7B7B" font-style="italic">//&#160;reward&#160;=&#160;clamp(&#160;mean(&#160;max(0,&#160;-n&#160;.&#160;f)&#160;),&#160;0,&#160;1&#160;)</tspan></text>
<text x="0" y="109" xml:space="preserve"><tspan fill="#3D7B7B" font-style="italic"></tspan><tspan fill="#008000" font-weight="bold">fn</tspan><tspan fill="#bbbbbb">&#160;</tspan><tspan fill="#0000FF">compute_alignment</tspan>(contacts:<tspan fill="#bbbbbb">&#160;</tspan><tspan fill="#008000">&amp;</tspan>[ActiveContact])<tspan fill="#bbbbbb">&#160;</tspan>-&gt;<tspan fill="#bbbbbb">&#160;</tspan><tspan fill="#B00040">f64</tspan><tspan fill="#bbbbbb">&#160;</tspan>{<tspan fill="#bbbbbb"></tspan></text>
<text x="0" y="128" xml:space="preserve"><tspan fill="#bbbbbb"></tspan><tspan fill="#bbbbbb">&#160;&#160;&#160;&#160;</tspan><tspan fill="#008000" font-weight="bold">let</tspan><tspan fill="#bbbbbb">&#160;</tspan>vals:<tspan fill="#bbbbbb">&#160;</tspan><tspan fill="#008000">Vec</tspan><tspan fill="#666666">&lt;</tspan><tspan fill="#B00040">f64</tspan><tspan fill="#666666">&gt;</tspan><tspan fill="#bbbbbb">&#160;</tspan><tspan fill="#666666">=</tspan><tspan fill="#bbbbbb">&#160;</tspan>contacts.iter()<tspan fill="#bbbbbb"></tspan></text>
<text x="0" y="147" xml:space="preserve"><tspan fill="#bbbbbb"></tspan><tspan fill="#bbbbbb">&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;</tspan>.filter(<tspan fill="#666666">|</tspan>c<tspan fill="#666666">|</tspan><tspan fill="#bbbbbb">&#160;</tspan>c.force_direction.norm()<tspan fill="#bbbbbb">&#160;</tspan><tspan fill="#666666">&gt;</tspan><tspan fill="#666666">=</tspan><tspan fill="#bbbbbb">&#160;</tspan><tspan fill="#666666">0.5</tspan>)<tspan fill="#bbbbbb"></tspan></text>
<text x="0" y="166" xml:space="preserve"><tspan fill="#bbbbbb"></tspan><tspan fill="#bbbbbb">&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;</tspan>.map(<tspan fill="#666666">|</tspan>c<tspan fill="#666666">|</tspan><tspan fill="#bbbbbb">&#160;</tspan>(<tspan fill="#666666">-</tspan>dot(<tspan fill="#666666">&amp;</tspan>c.surface_normal,<tspan fill="#bbbbbb">&#160;</tspan><tspan fill="#666666">&amp;</tspan>c.force_direction)).max(<tspan fill="#666666">0.0</tspan>))<tspan fill="#bbbbbb"></tspan></text>
<text x="0" y="185" xml:space="preserve"><tspan fill="#bbbbbb"></tspan><tspan fill="#bbbbbb">&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;</tspan>.collect();<tspan fill="#bbbbbb"></tspan></text>
<text x="0" y="204" xml:space="preserve"><tspan fill="#bbbbbb"></tspan><tspan fill="#bbbbbb">&#160;&#160;&#160;&#160;</tspan>vals.is_empty()<tspan fill="#bbbbbb">&#160;</tspan><tspan fill="#666666">?</tspan><tspan fill="#bbbbbb">&#160;</tspan><tspan fill="#666666">0.0</tspan><tspan fill="#bbbbbb">&#160;</tspan>:<tspan fill="#bbbbbb">&#160;</tspan><tspan fill="#0000FF" font-weight="bold">clamp</tspan>(mean(vals),<tspan fill="#bbbbbb">&#160;</tspan><tspan fill="#666666">0.0</tspan>,<tspan fill="#bbbbbb">&#160;</tspan><tspan fill="#666666">1.0</tspan>)<tspan fill="#bbbbbb"></tspan></text>
<text x="0" y="223" xml:space="preserve"><tspan fill="#bbbbbb"></tspan>}<tspan fill="#bbbbbb"></tspan></text>
<text x="0" y="242" xml:space="preserve"><tspan fill="#bbbbbb"></tspan><tspan fill="#bbbbbb"></tspan></text>
<text x="0" y="261" xml:space="preserve"><tspan fill="#bbbbbb"></tspan><tspan fill="#3D7B7B" font-style="italic">//&#160;Wrench&#160;proxy:&#160;spatial&#160;balance&#160;of&#160;contact&#160;normals&#160;(no&#160;mass&#160;estimate&#160;needed).</tspan></text>
<text x="0" y="280" xml:space="preserve"><tspan fill="#3D7B7B" font-style="italic"></tspan><tspan fill="#3D7B7B" font-style="italic">//&#160;force_closure&#160;=&#160;clamp(&#160;1&#160;-&#160;||mean(n)||,&#160;0,&#160;1&#160;)</tspan></text>
<text x="0" y="299" xml:space="preserve"><tspan fill="#3D7B7B" font-style="italic"></tspan><tspan fill="#008000" font-weight="bold">fn</tspan><tspan fill="#bbbbbb">&#160;</tspan><tspan fill="#0000FF">compute_force_closure</tspan>(contacts:<tspan fill="#bbbbbb">&#160;</tspan><tspan fill="#008000">&amp;</tspan>[ActiveContact])<tspan fill="#bbbbbb">&#160;</tspan>-&gt;<tspan fill="#bbbbbb">&#160;</tspan><tspan fill="#B00040">f64</tspan><tspan fill="#bbbbbb">&#160;</tspan>{<tspan fill="#bbbbbb"></tspan></text>
<text x="0" y="318" xml:space="preserve"><tspan fill="#bbbbbb"></tspan><tspan fill="#bbbbbb">&#160;&#160;&#160;&#160;</tspan><tspan fill="#008000" font-weight="bold">let</tspan><tspan fill="#bbbbbb">&#160;</tspan>mean_n<tspan fill="#bbbbbb">&#160;</tspan><tspan fill="#666666">=</tspan><tspan fill="#bbbbbb">&#160;</tspan>contacts.iter()<tspan fill="#bbbbbb"></tspan></text>
<text x="0" y="337" xml:space="preserve"><tspan fill="#bbbbbb"></tspan><tspan fill="#bbbbbb">&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;</tspan>.map(<tspan fill="#666666">|</tspan>c<tspan fill="#666666">|</tspan><tspan fill="#bbbbbb">&#160;</tspan>c.surface_normal)<tspan fill="#bbbbbb"></tspan></text>
<text x="0" y="356" xml:space="preserve"><tspan fill="#bbbbbb"></tspan><tspan fill="#bbbbbb">&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;</tspan>.sum::<tspan fill="#666666">&lt;</tspan>Vec3<tspan fill="#666666">&gt;</tspan>()<tspan fill="#bbbbbb">&#160;</tspan><tspan fill="#666666">/</tspan><tspan fill="#bbbbbb">&#160;</tspan>contacts.len()<tspan fill="#bbbbbb">&#160;</tspan><tspan fill="#008000" font-weight="bold">as</tspan><tspan fill="#bbbbbb">&#160;</tspan><tspan fill="#B00040">f64</tspan>;<tspan fill="#bbbbbb"></tspan></text>
<text x="0" y="375" xml:space="preserve"><tspan fill="#bbbbbb"></tspan><tspan fill="#bbbbbb">&#160;&#160;&#160;&#160;</tspan>clamp(<tspan fill="#666666">1.0</tspan><tspan fill="#bbbbbb">&#160;</tspan><tspan fill="#666666">-</tspan><tspan fill="#bbbbbb">&#160;</tspan>mean_n.norm(),<tspan fill="#bbbbbb">&#160;</tspan><tspan fill="#666666">0.0</tspan>,<tspan fill="#bbbbbb">&#160;</tspan><tspan fill="#666666">1.0</tspan>)<tspan fill="#bbbbbb"></tspan></text>
<text x="0" y="394" xml:space="preserve"><tspan fill="#bbbbbb"></tspan>}<tspan fill="#bbbbbb"></tspan></text>
<text x="0" y="413" xml:space="preserve"><tspan fill="#bbbbbb"></tspan></text></g></svg>
