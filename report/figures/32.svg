<?xml version="1.0"?>
<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.0//EN" "http://www.w3.org/TR/2001/REC-SVG-20010904/DTD/svg10.dtd">
<svg xmlns="http://www.w3.org/2000/svg" width="589" height="445" viewBox="0 0 589 445">
<text x="12" y="18" font-family="DejaVu Sans" font-size="15" font-weight="bold" fill="#111827">Loading the Mia-hand URDF with Pinocchio</text>
<g font-family="monospace" font-size="14px">
<text x="0" y="14" xml:space="preserve"><tspan fill="#008000" font-weight="bold">import</tspan><tspan fill="#bbbbbb">&#160;</tspan><tspan fill="#0000FF" font-weight="bold">numpy</tspan><tspan fill="#bbbbbb">&#160;</tspan><tspan fill="#008000" font-weight="bold">as</tspan><tspan fill="#bbbbbb">&#160;</tspan><tspan fill="#0000FF" font-weight="bold">np</tspan><tspan fill="#bbbbbb"></tspan></text>
<text x="0" y="33" xml:space="preserve"><tspan fill="#bbbbbb"></tspan><tspan fill="#008000" font-weight="bold">import</tspan><tspan fill="#bbbbbb">&#160;</tspan><tspan fill="#0000FF" font-weight="bold">pinocchio</tspan><tspan fill="#bbbbbb">&#160;</tspan><tspan fill="#008000" font-weight="bold">as</tspan><tspan fill="#bbbbbb">&#160;</tspan><tspan fill="#0000FF" font-weight="bold">pin</tspan><tspan fill="#bbbbbb"></tspan></text>
<text x="0" y="52" xml:space="preserve"><tspan fill="#bbbbbb"></tspan><tspan fill="#bbbbbb"></tspan></text>
<text x="0" y="71" xml:space="preserve"><tspan fill="#bbbbbb"></tspan><tspan fill="#3D7B7B" font-style="italic">#&#160;Load&#160;the&#160;simplified&#160;Mia-hand&#160;URDF&#160;used&#160;for&#160;LUT&#160;generation.</tspan><tspan fill="#bbbbbb"></tspan></text>
<text x="0" y="90" xml:space="preserve"><tspan fill="#bbbbbb"></tspan><tspan fill="#3D7B7B" font-style="italic">#&#160;(6&#160;actuated&#160;revolute&#160;joints:&#160;index/little/mrl/ring/thumb_opp/thumb_fle)</tspan><tspan fill="#bbbbbb"></tspan></text>
<text x="0" y="109" xml:space="preserve"><tspan fill="#bbbbbb"></tspan>model&#160;<tspan fill="#666666">=</tspan>&#160;pin<tspan fill="#666666">.</tspan>buildModelFromUrdf(<tspan fill="#BA2121">&quot;</tspan><tspan fill="#BA2121">urdf/mia_hand_flat.urdf</tspan><tspan fill="#BA2121">&quot;</tspan>)<tspan fill="#bbbbbb"></tspan></text>
<text x="0" y="128" xml:space="preserve"><tspan fill="#bbbbbb"></tspan>data&#160;<tspan fill="#666666">=</tspan>&#160;model<tspan fill="#666666">.</tspan>createData()<tspan fill="#bbbbbb"></tspan></text>
<text x="0" y="147" xml:space="preserve"><tspan fill="#bbbbbb"></tspan><tspan fill="#bbbbbb"></tspan></text>
<text x="0" y="166" xml:space="preserve"><tspan fill="#bbbbbb"></tspan><tspan fill="#3D7B7B" font-style="italic">#&#160;Configuration&#160;vector&#160;q&#160;(nq=6),&#160;values&#160;in&#160;[0,&#160;1]:</tspan><tspan fill="#bbbbbb"></tspan></text>
<text x="0" y="185" xml:space="preserve"><tspan fill="#bbbbbb"></tspan><tspan fill="#3D7B7B" font-style="italic">#&#160;&#160;&#160;[index_fle,&#160;little_fle,&#160;mrl_fle,&#160;ring_fle,&#160;thumb_opp,&#160;thumb_fle]</tspan><tspan fill="#bbbbbb"></tspan></text>
<text x="0" y="204" xml:space="preserve"><tspan fill="#bbbbbb"></tspan>q&#160;<tspan fill="#666666">=</tspan>&#160;pin<tspan fill="#666666">.</tspan>neutral(model)<tspan fill="#bbbbbb"></tspan></text>
<text x="0" y="223" xml:space="preserve"><tspan fill="#bbbbbb"></tspan>q[<tspan fill="#666666">0</tspan>]&#160;<tspan fill="#666666">=</tspan>&#160;<tspan fill="#666666">0.5</tspan>&#160;&#160;&#160;<tspan fill="#3D7B7B" font-style="italic">#&#160;index&#160;half-closed</tspan><tspan fill="#bbbbbb"></tspan></text>
<text x="0" y="242" xml:space="preserve"><tspan fill="#bbbbbb"></tspan>q[<tspan fill="#666666">2</tspan>]&#160;<tspan fill="#666666">=</tspan>&#160;<tspan fill="#666666">0.5</tspan>&#160;&#160;&#160;<tspan fill="#3D7B7B" font-style="italic">#&#160;mrl&#160;half-closed</tspan><tspan fill="#bbbbbb"></tspan></text>
<text x="0" y="261" xml:space="preserve"><tspan fill="#bbbbbb"></tspan>q[<tspan fill="#666666">4</tspan>]&#160;<tspan fill="#666666">=</tspan>&#160;<tspan fill="#666666">1.0</tspan>&#160;&#160;&#160;<tspan fill="#3D7B7B" font-style="italic">#&#160;thumb&#160;abducted</tspan><tspan fill="#bbbbbb"></tspan></text>
<text x="0" y="280" xml:space="preserve"><tspan fill="#bbbbbb"></tspan>q[<tspan fill="#666666">5</tspan>]&#160;<tspan fill="#666666">=</tspan>&#160;<tspan fill="#666666">0.5</tspan>&#160;&#160;&#160;<tspan fill="#3D7B7B" font-style="italic">#&#160;thumb&#160;half-closed</tspan><tspan fill="#bbbbbb"></tspan></text>
<text x="0" y="299" xml:space="preserve"><tspan fill="#bbbbbb"></tspan><tspan fill="#bbbbbb"></tspan></text>
<text x="0" y="318" xml:space="preserve"><tspan fill="#bbbbbb"></tspan><tspan fill="#3D7B7B" font-style="italic">#&#160;Forward&#160;kinematics&#160;-&gt;&#160;world&#160;transform&#160;of&#160;a&#160;named&#160;frame&#160;(index&#160;sensor/tip).</tspan><tspan fill="#bbbbbb"></tspan></text>
<text x="0" y="337" xml:space="preserve"><tspan fill="#bbbbbb"></tspan>pin<tspan fill="#666666">.</tspan>forwardKinematics(model,&#160;data,&#160;q)<tspan fill="#bbbbbb"></tspan></text>
<text x="0" y="356" xml:space="preserve"><tspan fill="#bbbbbb"></tspan>fid&#160;<tspan fill="#666666">=</tspan>&#160;model<tspan fill="#666666">.</tspan>getFrameId(<tspan fill="#BA2121">&quot;</tspan><tspan fill="#BA2121">mia_index_sensor</tspan><tspan fill="#BA2121">&quot;</tspan>)<tspan fill="#bbbbbb"></tspan></text>
<text x="0" y="375" xml:space="preserve"><tspan fill="#bbbbbb"></tspan>pin<tspan fill="#666666">.</tspan>updateFramePlacement(model,&#160;data,&#160;fid)<tspan fill="#bbbbbb"></tspan></text>
<text x="0" y="394" xml:space="preserve"><tspan fill="#bbbbbb"></tspan>T&#160;<tspan fill="#666666">=</tspan>&#160;data<tspan fill="#666666">.</tspan>oMf[fid]<tspan fill="#bbbbbb"></tspan></text>
<text x="0" y="413" xml:space="preserve"><tspan fill="#bbbbbb"></tspan><tspan fill="#bbbbbb"></tspan></text>
<text x="0" y="432" xml:space="preserve"><tspan fill="#bbbbbb"></tspan><tspan fill="#008000">print</tspan>(<tspan fill="#BA2121">&quot;</tspan><tspan fill="#BA2121">translation:</tspan><tspan fill="#BA2121">&quot;</tspan>,&#160;T<tspan fill="#666666">.</tspan>translation)&#160;&#160;&#160;<tspan fill="#3D7B7B" font-style="italic">#&#160;3-vector</tspan><tspan fill="#bbbbbb"></tspan></text>
<text x="0" y="451" xml:space="preserve"><tspan fill="#bbbbbb"></tspan><tspan fill="#008000">print</tspan>(<tspan fill="#BA2121">&quot;</tspan><tspan fill="#BA2121">rotation:&#160;&#160;&#160;</tspan><tspan fill="#BA2121">&quot;</tspan>,&#160;T<tspan fill="#666666">.</tspan>rotation)&#160;&#160;&#160;&#160;&#160;&#160;<tspan fill="#3D7B7B" font-style="italic">#&#160;3x3&#160;matrix</tspan><tspan fill="#bbbbbb"></tspan></text>
<text x="0" y="470" xml:space="preserve"><tspan fill="#bbbbbb"></tspan>M&#160;<tspan fill="#666666">=</tspan>&#160;T<tspan fill="#666666">.</tspan>homogeneous&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;<tspan fill="#3D7B7B" font-style="italic">#&#160;4x4&#160;SE(3)&#160;transform</tspan><tspan fill="#bbbbbb"></tspan></text>
<text x="0" y="489" xml:space="preserve"><tspan fill="#bbbbbb"></tspan></text></g></svg>
