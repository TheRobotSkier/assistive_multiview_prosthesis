# Docker Compose configuration for ROS2 development environment
# This file defines the base configuration for the ROS2 container.
# Use with: docker-compose -f docker-compose.yml up

services:
  ros:
    build:
      context: .
      dockerfile: Dockerfile
    image: mv_prosthesis:latest
    container_name: mv_prosthesis_dev

    # For Windows (default bridge networking):
    ports:
      - "11311:11311"  # ROS2 DDS communication
    
    # Volumes for development
    volumes:
      # Mount the container folder
      - ./laptop_ws:/laptop_ws
    
    # Environment variables
    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
    
    # Interactive terminal
    stdin_open: true
    tty: true
    
    # Keep container running
    command: /bin/bash
    # Restart automatically:
    restart: unless-stopped

