ekf_filter_node:
  ros__parameters:
    frequency: 100.0
    sensor_timeout: 0.1
    two_d_mode: false
    publish_tf: false
    map_frame: map
    odom_frame: odom
    base_link_frame: cam0_base_link
    world_frame: odom

    imu0: /cam0/data_raw
    imu0_config: [false, false, false,
                  false, false, false,
                  false, false, false,
