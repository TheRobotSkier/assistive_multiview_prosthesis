services:
  miahand_ros2:
    build:
      context: ..
      dockerfile: docker-deployment/Dockerfile
      args:
        - USER_UID=${USER_UID}
        - USER_GID=${USER_GID}
    container_name: miahand_ros2
    network_mode: "host"
    # device_cgroup_rules:
    #   - "c 188:* rmw"
    privileged: true
    tty: true
    stdin_open: true
    volumes:
      - ../:/miahand_ws/src
      - /tmp/.X11-unix:/tmp/.X11-unix
      - ${XAUTHORITY}:/tmp/.Xauthority:ro,z # added LINUX
    entrypoint: /ros_entrypoint.sh
    environment:
      tty: true
      PYTHONPATH: "/opt/ros/jazzy/lib/python3.12/site-packages"
      QT_X11_NO_MITSHM: 1
      DISPLAY: $DISPLAY
      XAUTHORITY: /tmp/.Xauthority # added LINUX
      ROS_AUTOMATIC_DISCOVERY_RANGE: LOCALHOST #added LINUX
      RMW_IMPLEMENTATION: ${RMW_IMPLEMENTATION:-rmw_cyclonedds_cpp} #added LINUX

    user: "1000:1000" # UID/GID must match the host user for socket access
    userns_mode: "keep-id" # rootless Podman: preserve host UID mapping for bind-mounted auth files
    command: /bin/bash

  miahand_description:
    extends: miahand_ros2
    container_name: miahand_ros2_rviz
    profiles: [standalone]
    command: >
      bash -c "
        source install/setup.bash &&
        ros2 launch mia_hand_description mia_hand_rviz_launch.py;
        /bin/bash
      "
  miahand_driver:
    extends: miahand_ros2
    container_name: miahand_ros2_driver
    profiles: [standalone, full_system]
    command: >
      bash -c "
        source install/setup.bash &&
        ros2 launch mia_hand_driver mia_hand_driver_launch.py;
        /bin/bash
      "
  miahand_moveit:
    extends: miahand_ros2
    container_name: miahand_ros2_moveit
    profiles: [standalone]
    environment:
      - USE_MUJOCO_SIM=${USE_MUJOCO_SIM:-true}
      - USE_MOCK_HARDWARE=${USE_MOCK_HARDWARE:-true}
    command: >
      bash -c "
        source install/setup.bash &&
        ros2 launch mia_hand_moveit_config mia_hand_moveit.launch.py use_mujoco_sim:=${USE_MUJOCO_SIM:-true} use_mock_hardware:=${USE_MOCK_HARDWARE:-true};
        /bin/bash
      "
  miahand_mujoco:
    extends: miahand_ros2
    container_name: miahand_ros2_mujoco
    profiles: [standalone]
    environment:
      - MUJOCO_SCENE=${MUJOCO_SCENE:-custom}
      - ENABLE_DEPTH_PUBLISHER=${ENABLE_DEPTH_PUBLISHER:-true}
    command: >
      bash -c "
        source install/setup.bash &&
        ros2 launch mia_hand_mujoco mia_hand_system_interface_launch.py scene:=${MUJOCO_SCENE:-static} enable_depth_publisher:=${ENABLE_DEPTH_PUBLISHER:-true};
        /bin/bash
      "
  mujoco_dynamic:
    extends: miahand_ros2
    container_name: miahand_ros2_mujoco_dynamic
    profiles: [standalone]
    environment:
      - MUJOCO_HARDWARE_PLUGIN=${MUJOCO_HARDWARE_PLUGIN:-mia_hand_mujoco/PlannerGuiSystemInterface}
    command: >
      bash -c "
        cd /miahand_ws &&
        source /opt/ros/jazzy/setup.bash &&
        colcon build --packages-select mia_hand_mujoco &&
        source install/setup.bash &&
        ros2 launch mia_hand_mujoco mia_hand_system_interface_launch.py scene:=dynamic enable_depth_publisher:=true hardware_plugin:=${MUJOCO_HARDWARE_PLUGIN:-mia_hand_mujoco/PlannerGuiSystemInterface};
        /bin/bash
      "
  mujoco_interactive:
    extends: miahand_ros2
    container_name: miahand_ros2_mujoco_interactive
    profiles: [standalone]
    environment:
      - MUJOCO_OBJECT=${MUJOCO_OBJECT:-sphere}
      - MUJOCO_PC_MODE=${MUJOCO_PC_MODE:-object}
    command: >
      bash -c "
        cd /miahand_ws &&
        source /opt/ros/jazzy/setup.bash &&
        colcon build --packages-select mia_hand_mujoco &&
        source install/setup.bash &&
        ros2 launch mia_hand_mujoco mia_hand_system_interface_launch.py scene:=${MUJOCO_OBJECT:-sphere} depth_target_geom_name:=target_${MUJOCO_OBJECT:-sphere} depth_pc_mode:=${MUJOCO_PC_MODE:-object} enable_depth_publisher:=true hardware_plugin:=mia_hand_mujoco/InteractiveSystemInterface;
        /bin/bash
      "
  mujoco_trajectory:
    extends: miahand_ros2
    container_name: miahand_ros2_mujoco_trajectory
    profiles: [standalone]
    environment:
      - MUJOCO_OBJECT=${MUJOCO_OBJECT:-sphere}
      - MUJOCO_PC_MODE=${MUJOCO_PC_MODE:-object}
    command: >
      bash -c "
        cd /miahand_ws &&
        source /opt/ros/jazzy/setup.bash &&
        colcon build --packages-select mia_hand_mujoco &&
        source install/setup.bash &&
        ros2 launch mia_hand_mujoco mia_hand_system_interface_launch.py scene:=${MUJOCO_OBJECT:-sphere} depth_target_geom_name:=target_${MUJOCO_OBJECT:-sphere} depth_pc_mode:=${MUJOCO_PC_MODE:-object} enable_depth_publisher:=true hardware_plugin:=mia_hand_mujoco/InteractiveSystemInterface &
        sleep 5 &&
        source install/setup.bash &&
        LAUNCH_PID=\$! &&
        ros2 run mia_hand_mujoco mujoco_hand_trajectory_node.py ;
        wait \$LAUNCH_PID ;
        /bin/bash
      "
  miahand_ros2_control:
    extends: miahand_ros2
    container_name: miahand_ros2_control
    profiles: [standalone]
    environment:
      - USE_MOCK_HARDWARE=${USE_MOCK_HARDWARE:-true}
    command: >
      bash -c "
        source install/setup.bash &&
        ros2 launch mia_hand_ros2_control mia_hand_system_interface_launch.py use_mock_hardware:=${USE_MOCK_HARDWARE:-true};
        /bin/bash
      "

  miahand_hardware:
    extends: miahand_ros2
    container_name: miahand_ros2_hardware
    profiles: [standalone]
    privileged: true
    userns_mode: "host" # required for rootful hardware access with device cgroup rules
    devices:
      - /dev/ttyUSB0:/dev/ttyUSB0
      - /dev/ttyUSB1:/dev/ttyUSB1
    environment:
      - USE_MOCK_HARDWARE=false
      - MIA_SERIAL_PORT=${MIA_SERIAL_PORT:-/dev/ttyUSB1}
      - WRIST_PORT=${WRIST_PORT:-/dev/ttyUSB0}
    command: >
      bash -c "
        source install/setup.bash &&
        ros2 launch mia_hand_ros2_control mia_hand_with_wrist_system_interface_launch.py serial_port:=${MIA_SERIAL_PORT:-/dev/ttyUSB1} wrist_port:=${WRIST_PORT:-/dev/ttyUSB0} use_mock_hardware:=false;
        /bin/bash
      "
  mindrove_emg:
    build:
      context: ../dev/mindrove
      dockerfile: Dockerfile
    container_name: mindrove_emg
    network_mode: "host"
    tty: true
    stdin_open: true
    profiles: [standalone]

  # ── Classical EMG classifier services ────────────────────────────────────
  # Shared build context: same image as mindrove_emg (re-used via cache).
  # data/ and models/ are bind-mounted so files persist between runs.

  mindrove_emg_collect:
    build:
      context: ../dev/mindrove
      dockerfile: Dockerfile
    container_name: mindrove_emg_collect
    network_mode: "host"
    tty: true
    stdin_open: true
    profiles: [standalone]
    volumes:
      - ../dev/mindrove/data:/app/data
      - ../dev/mindrove/models:/app/models
    command: ["python", "scripts/collect_data.py"]

  mindrove_emg_train:
    build:
      context: ../dev/mindrove
      dockerfile: Dockerfile
    container_name: mindrove_emg_train
    network_mode: "host"
    tty: true
    stdin_open: true
    profiles: [standalone]
    volumes:
      - ../dev/mindrove/data:/app/data
      - ../dev/mindrove/models:/app/models
    command: ["python", "scripts/train.py"]

  mindrove_emg_run:
    build:
      context: ../dev/mindrove
      dockerfile: Dockerfile
    container_name: mindrove_emg_run
    network_mode: "host"
    tty: true
    stdin_open: true
    profiles: [standalone]
    volumes:
      - ../dev/mindrove/data:/app/data
      - ../dev/mindrove/models:/app/models
    command: ["python", "scripts/run_classifier.py"]

  mindrove_emg_ros:
    build:
      context: ../dev/mindrove
      dockerfile: Dockerfile.ros
    container_name: mindrove_emg_ros
    network_mode: "host"
    tty: true
    stdin_open: true
    profiles: [full_system]
    volumes:
      - ../dev/mindrove/data:/app/data
      - ../dev/mindrove/models:/app/models
    environment:
      RMW_IMPLEMENTATION: rmw_cyclonedds_cpp
      ROS_AUTOMATIC_DISCOVERY_RANGE: LOCALHOST
    command: ["python", "scripts/run_classifier.py"]

  mindrove_cpp:
    build:
      context: ../dev/mindrove_cpp
      dockerfile: Dockerfile
    container_name: mindrove_cpp
    network_mode: "host"
    tty: true
    stdin_open: true
    profiles: [standalone]
    volumes:
      - ../dev/mindrove_cpp:/src:ro
      - ../dev/mindrove/mindroveSDK/mindrovesdk-5.3.0-linux-x64:/sdk:ro

  # ── Multiview cameras — ROS Humble (RealSense camera access) ──────────────
  # Runs the official realsense2_camera launch in ROS Humble.
  # Device passthrough uses only /dev/bus/usb (librealsense enumerates via USB
  # descriptors; explicit /dev/videoN mappings become stale on reconnect).
  #
  # Single camera (default):
  #   docker compose --profile standalone up multiview_cameras
  #
  # Dual cameras (set CAM2_SERIAL):
  #   CAM1_SERIAL=829212072207 CAM2_SERIAL=827112072033 \
  #     docker compose --profile standalone up multiview_cameras
  #
  # The probe script auto-detects dual mode when CAM2_SERIAL is set.
  multiview_cameras:
    build:
      context: ../dev/multiview
      dockerfile: Dockerfile.humble_cameras
    container_name: multiview_cameras
    network_mode: "host"
    ipc: host
    privileged: true
    tty: true
    stdin_open: true
    profiles: [standalone, full_system]
    devices:
      - /dev/bus/usb:/dev/bus/usb
    environment:
      RMW_IMPLEMENTATION: rmw_fastrtps_cpp
      CAM1_SERIAL: ${CAM1_SERIAL:-829212072207}
      CAM2_SERIAL: ${CAM2_SERIAL:-}
    command: ["/ros_ws/scripts/realsense_ros_probe.sh"]

  # ── RViz2 pointcloud viewer — ROS Humble ──────────────────────────────────
  # Displays the RealSense depth pointcloud(s) (cam1 and cam2 individually,
  # plus /fused_pointcloud if fusion is enabled) in RViz2.
  # Requires X11 forwarding to the host display.
  # Start with cameras:
  #   docker compose --profile standalone up multiview_cameras multiview_rviz2
  multiview_rviz2:
    build:
      context: ../dev/multiview
      dockerfile: Dockerfile.rviz2
    container_name: multiview_rviz2
    network_mode: "host"
    ipc: host
    tty: true
    stdin_open: true
    profiles: [standalone, full_system]
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix
      - ${XAUTHORITY}:/tmp/.Xauthority:ro,z
    environment:
      DISPLAY: $DISPLAY
      XAUTHORITY: /tmp/.Xauthority
      QT_X11_NO_MITSHM: 1
      HOME: /tmp
      RMW_IMPLEMENTATION: rmw_fastrtps_cpp
    userns_mode: "keep-id"

  # Variant: dual cameras with multiview_full_launch.py (includes static TF
  # alignment). Provides individual pointclouds on:
  #   /cam1/d435_1/depth/color/points
  #   /cam2/d435_2/depth/color/points
  # Configure both camera serials and an X-offset for alignment.
  multiview_full:
    build:
      context: ../dev/multiview
      dockerfile: Dockerfile.humble_cameras
    container_name: multiview_full
    network_mode: "host"
    ipc: host
    privileged: true
    tty: true
    stdin_open: true
    profiles: [standalone, full_system]
    devices:
      - /dev/bus/usb:/dev/bus/usb
    environment:
      RMW_IMPLEMENTATION: rmw_fastrtps_cpp
      CAM1_SERIAL: ${CAM1_SERIAL:-829212072207}
      CAM2_SERIAL: ${CAM2_SERIAL:-827112072033}
      CAM2_OFFSET_X: ${CAM2_OFFSET_X:-0.5}
      REALSENSE_ENABLE_COLOR: ${REALSENSE_ENABLE_COLOR:-true}
    command: ["ros2", "launch", "/ros_ws/launch/multiview_full_launch.py"]

  naviflame:
    build:
      context: ../dev/mindrove_naviflame
      dockerfile: Dockerfile
    container_name: naviflame
    network_mode: "host"
    tty: true
    stdin_open: true
    profiles: [standalone]
    depends_on:
      - naviflame_ros_bridge
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix
      - ${XAUTHORITY}:/tmp/.Xauthority:ro,z
    environment:
      DISPLAY: $DISPLAY
      XAUTHORITY: /tmp/.Xauthority
      QT_X11_NO_MITSHM: 1

  naviflame_ros_bridge:
    build:
      context: ../dev/mindrove_naviflame
      dockerfile: Dockerfile.bridge
    container_name: naviflame_ros_bridge
    network_mode: "host"
    tty: true
    stdin_open: true
    profiles: [standalone]
    environment:
      RMW_IMPLEMENTATION: rmw_cyclonedds_cpp
      ROS_AUTOMATIC_DISCOVERY_RANGE: LOCALHOST

  # ── Haptic armband BT-ROS2 bridge ────────────────────────────────────────
  # Connects to two Vibro8 Bluetooth Classic devices (8 motors each = 16 total).
  # Subscribes to /haptic_band/motors (std_msgs/Float32MultiArray, 16 values 0-100).
  # Configure BT addresses via env vars if they differ from the defaults.
  haptic_band:
    build:
      context: ../dev/haptic_band
      dockerfile: Dockerfile
    container_name: haptic_band
    network_mode: "host"
    privileged: true
    tty: true
    stdin_open: true
    profiles: [standalone, full_system]
    volumes:
      - ../:/miahand_ws/src:ro
    environment:
      RMW_IMPLEMENTATION: rmw_cyclonedds_cpp
      ROS_AUTOMATIC_DISCOVERY_RANGE: LOCALHOST
      HAPTIC_BT_ADDR1: ${HAPTIC_BT_ADDR1:-842E1409E14E}
      HAPTIC_BT_ADDR2: ${HAPTIC_BT_ADDR2:-8CF681F32E12}

  # ── Haptic motor sweep test ───────────────────────────────────────────────
  # Publishes a sequential ramp-up test to /haptic_band/motors.
  # Run alongside haptic_band to exercise all 16 motors one by one.
  haptic_band_test:
    build:
      context: ../dev/haptic_band
      dockerfile: Dockerfile
    container_name: haptic_band_test
    network_mode: "host"
    tty: true
    stdin_open: true
    profiles: [standalone]
    volumes:
      - ../dev/haptic_band/scripts:/scripts:ro
    environment:
      RMW_IMPLEMENTATION: rmw_cyclonedds_cpp
      ROS_AUTOMATIC_DISCOVERY_RANGE: LOCALHOST
    command: ["python3", "/scripts/motor_test.py"]

  # ── Rust grasp-preshaping build ───────────────────────────────────────────
  # One-shot service: compiles libgrasp_preshaping.so and writes the output to
  # docker_ws/dev/grasp_preshaping/target/release/ on the host (via bind mount).
  # Run this once before starting any simulation service that uses the grasp
  # planner, and re-run whenever the Rust source changes.
  #
  #   docker compose --profile standalone up rust_build
  #
  rust_build:
    build:
      context: ..
      dockerfile: docker-deployment/Dockerfile.rust_build
    container_name: rust_build
    network_mode: "host"
    profiles: [standalone]
    volumes:
      - ../dev/grasp_preshaping:/build
      - rust_cargo_cache:/usr/local/cargo/registry

  # ── Full system test — main Jazzy orchestration ───────────────────────────
  # Starts: MuJoCo mirror + haptic controller + segmentation + RViz.
  # Camera access is expected from the `multiview_cameras` service (single or dual).
  # Individual pointcloud topics: /cam1/d435_1/depth/color/points
  #                               /cam2/d435_2/depth/color/points
  full_system_test:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: full_system_test
    network_mode: "host"
    privileged: true
    tty: true
    stdin_open: true
    profiles: [full_system]
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix
      - ${XAUTHORITY}:/tmp/.Xauthority:ro,z
      - ../../:/miahand_ws/src:ro
    environment:
      DISPLAY: $DISPLAY
      XAUTHORITY: /tmp/.Xauthority
      QT_X11_NO_MITSHM: 1
      RMW_IMPLEMENTATION: rmw_fastrtps_cpp
    command: >
      bash -c "
        source /opt/ros/jazzy/setup.bash &&
        source /miahand_ws/install/setup.bash &&
        ros2 launch /miahand_ws/src/dev/mujoco/launch/full_system_test_launch.py
      "

  # ── Segmentation: one-shot CPU inference test (no ROS) ───────────────────────
  # Downloads weights on first run, then runs a single inference to verify setup.
  segmentation_direct:
    build:
      context: ../dev/pc_segmentation
      dockerfile: docker/Dockerfile.cpu
    container_name: segmentation_direct
    profiles: [standalone]
    volumes:
      - ../dev/pc_segmentation/weights:/weights
    command: >
      bash -c "
        if [ ! -f /weights/weights_exp14_14.pth ]; then
          mkdir -p /weights &&
          wget -q https://omnomnom.vision.rwth-aachen.de/data/3d_inter_obj_seg/scannet_official/weights/weights_exp14_14.pth
               -O /weights/weights_exp14_14.pth;
        fi &&
        python run_inter3d.py
          --verbal=True
          --instance_counter_id=0
          --number_of_instances=1
          --cubeedge=0.05
          --pretraining_weights=/weights/weights_exp14_14.pth
          --dataset=scannet
      "

  # ── Segmentation: inference server (MinkowskiEngine, Python 3.8) ────────────
  # Runs the Flask HTTP inference server on localhost:5678.
  # Downloads weights automatically on first start.
  # Usage: docker compose --profile segmentation up segmentation_inference
  segmentation_inference:
    build:
      context: ../dev/pc_segmentation
      dockerfile: docker/Dockerfile.cpu
    container_name: segmentation_inference
    network_mode: "host"
    profiles: [full_system, segmentation]
    volumes:
      - ../dev/pc_segmentation/weights:/weights

  # ── Segmentation: ROS2 node (Python 3.12, calls inference server over HTTP) ──
  # Subscribes to:
  #   /segmentation/input_cloud      (sensor_msgs/PointCloud2)
  #   /segmentation/click_positive   (geometry_msgs/PointStamped)
  #   /segmentation/click_negative   (geometry_msgs/PointStamped)
  #   /segmentation/reset            (std_msgs/Empty)
  # Publishes foreground points to:
  #   /segmentation/object_cloud     (sensor_msgs/PointCloud2)
  # Start both together: docker compose --profile segmentation up
  # (use run_segmentation.sh for health-poll ordering between the two)
  segmentation_ros2:
    extends: miahand_ros2
    container_name: segmentation_ros2
    profiles: [full_system, segmentation]
    command: |
      bash -c "
        source /opt/ros/jazzy/setup.bash;
        source /miahand_ws/install/setup.bash 2>/dev/null
        python3 /miahand_ws/src/dev/pc_segmentation/nodes/segmentation_ros2_node.py
      "

  # ── Segmentation: interactive demo (RViz2 + cloud publisher + click relay) ─
  # -- Segmentation: interactive demo (RViz2 + cloud publisher + click relay) --
  # Publishes D435_img_1.ply, opens RViz2, relays clicks to the segmentation node.
  # Requires X11 forwarding and segmentation_ros2 running.
  # In the terminal that opens: p=positive mode, n=negative mode, r=reset, q=quit
  segmentation_demo:
    extends: miahand_ros2
    container_name: segmentation_demo
    stdin_open: true
    tty: true
    profiles: [standalone]
    command: |
      bash -c "
        source /opt/ros/jazzy/setup.bash;
        source /miahand_ws/install/setup.bash 2>/dev/null;
        ros2 run tf2_ros static_transform_publisher --x 0 --y 0 --z 0 --qx 0.7071 --qy 0 --qz 0 --qw 0.7071 --frame-id map --child-frame-id ply_camera &
        python3 /miahand_ws/src/dev/pc_segmentation/nodes/demo_cloud_publisher_node.py --ply /miahand_ws/src/dev/pc_segmentation/depth_images/D435_img_1.ply &
        rviz2 -d /miahand_ws/src/dev/pc_segmentation/demo_config.rviz &
        python3 /miahand_ws/src/dev/pc_segmentation/nodes/demo_click_relay_node.py;
        wait
      "

  # -- Digital Twin: real cameras + simulated Mia Hand ------------------------
  # Visualizes real camera pointclouds, runs segmentation, computes grasps, and
  # drives a simulated Mia Hand as a digital twin.
  #
  # Prerequisites:
  #   1. rust_build   (one-shot) -- ensures libgrasp_preshaping.so exists.
  #   2. segmentation_inference (standalone or full_system) -- HTTP server on :5678.
  #   3. multiview_cameras (standalone or full_system) -- publishes individual
  #      depth pointclouds from one or two real D435 cameras under
  #      /cam{1,2}/d435_{1,2}/depth/color/points and /fused_pointcloud.
  #
  # Individual pointcloud topics:
  #   /cam1/d435_1/depth/color/points
  #   /cam2/d435_2/depth/color/points
  #
  # Usage:
  #   docker compose --profile standalone up digital_twin
  #
  # After RViz opens:
  #   - Click "Publish Point" tool, click on the object in the pointcloud.
  #   - Call the grasp service:
  #       ros2 service call /grasp_preshaping/compute_grasp std_srvs/srv/Trigger
  #   - Watch the simulated hand preshape (far) and close (near).
  digital_twin:
    extends: miahand_ros2
    container_name: miahand_digital_twin
    profiles: [standalone]
    environment:
      - RMW_IMPLEMENTATION=rmw_fastrtps_cpp
      - USE_TRAJECTORY=${USE_TRAJECTORY:-false}
      - INFERENCE_URL=${INFERENCE_URL:-http://127.0.0.1:5678}
      - SEGMENTATION_CUBEEDGE=${SEGMENTATION_CUBEEDGE:-0.05}
    command: >
      bash -c "
        source install/setup.bash &&
        ros2 launch /miahand_ws/src/dev/mujoco/launch/digital_twin_launch.py
          use_trajectory:=${USE_TRAJECTORY:-false}
          inference_url:=${INFERENCE_URL:-http://127.0.0.1:5678}
          segmentation_cubeedge:=${SEGMENTATION_CUBEEDGE:-0.05};
        /bin/bash
      "

volumes:
  rust_cargo_cache:
