services:
  miahand_ros2:
    build:
      context: ..
      dockerfile: docker-deployment/Dockerfile
      args:
        - USER_UID=${USER_UID}
        - USER_GID=${USER_GID}
    container_name: miahand_ros2
    network_mode: "host"
    privileged: true
    tty: true
    stdin_open: true
    runtime: nvidia
    ipc: host
    group_add:
      - video
      - plugdev
      - dialout
      - i2c
    volumes:
      - ../:/miahand_ws/src
      - /tmp/.X11-unix:/tmp/.X11-unix
      - ${XAUTHORITY}:/tmp/.Xauthority:ro,z
      - /dev:/dev
      - /run/udev:/run/udev:ro
      - ./cyclonedds_robotlab.xml:/tmp/cyclonedds_peer.xml:ro
    entrypoint: /ros_entrypoint.sh
    environment:
      tty: true
      PYTHONPATH: "/opt/ros/jazzy/lib/python3.12/site-packages"
      QT_X11_NO_MITSHM: 1
      DISPLAY: $DISPLAY
      RMW_IMPLEMENTATION: rmw_fastrtps_cpp
      ROS_DISCOVERY_SERVER: 10.42.0.2:11811
      XAUTHORITY: /tmp/.Xauthority
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: graphics,display,compute,utility
    user: "${USER_UID}:${USER_GID}"
    command: /bin/bash

  miahand_description:
    extends: miahand_ros2
    container_name: miahand_ros2_rviz
    command: >
      bash -c "
        source install/setup.bash &&
        ros2 launch mia_hand_description mia_hand_rviz_launch.py;
        /bin/bash
      "

  miahand_driver:
    extends: miahand_ros2
    container_name: miahand_ros2_driver
    command: >
      bash -c "
        source install/setup.bash &&
        ros2 launch mia_hand_driver mia_hand_driver_launch.py;
        /bin/bash
      "

  miahand_moveit:
    extends: miahand_ros2
    container_name: miahand_ros2_moveit
    environment:
      - USE_MUJOCO_SIM=${USE_MUJOCO_SIM:-true}
      - USE_MOCK_HARDWARE=${USE_MOCK_HARDWARE:-true}
    command: >
      bash -c "
        source install/setup.bash &&
        ros2 launch mia_hand_moveit_config mia_hand_moveit.launch.py use_mujoco_sim:=${USE_MUJOCO_SIM:-true} use_mock_hardware:=${USE_MOCK_HARDWARE:-true};
        /bin/bash
      "

  miahand_mujoco:
    extends: miahand_ros2
    container_name: miahand_ros2_mujoco
    environment:
      - MUJOCO_SCENE=${MUJOCO_SCENE:-custom}
      - ENABLE_DEPTH_PUBLISHER=${ENABLE_DEPTH_PUBLISHER:-true}
    command: >
      bash -c "
        source install/setup.bash &&
        ros2 launch mia_hand_mujoco mia_hand_system_interface_launch.py scene:=${MUJOCO_SCENE:-static} enable_depth_publisher:=${ENABLE_DEPTH_PUBLISHER:-true};
        /bin/bash
      "

  mujoco_dynamic:
    extends: miahand_ros2
    container_name: miahand_ros2_mujoco_dynamic
    environment:
      - MUJOCO_HARDWARE_PLUGIN=${MUJOCO_HARDWARE_PLUGIN:-mia_hand_mujoco/PlannerGuiSystemInterface}
    command: >
      bash -c "
        source /opt/ros/jazzy/setup.bash &&
        cd /miahand_ws &&
        colcon build --packages-select mia_hand_mujoco &&
        source install/setup.bash &&
        ros2 launch mia_hand_mujoco mia_hand_system_interface_launch.py scene:=dynamic enable_depth_publisher:=true hardware_plugin:=${MUJOCO_HARDWARE_PLUGIN:-mia_hand_mujoco/PlannerGuiSystemInterface};
        /bin/bash
      "

  mujoco_interactive:
    extends: miahand_ros2
    container_name: miahand_ros2_mujoco_interactive
    environment:
      - MUJOCO_OBJECT=${MUJOCO_OBJECT:-sphere}
      - MUJOCO_PC_MODE=${MUJOCO_PC_MODE:-object}
    command: >
      bash -c "
        source /opt/ros/jazzy/setup.bash &&
        cd /miahand_ws &&
        colcon build --packages-select mia_hand_mujoco &&
        source install/setup.bash &&
        ros2 launch mia_hand_mujoco mia_hand_system_interface_launch.py scene:=${MUJOCO_OBJECT:-sphere} depth_target_geom_name:=target_${MUJOCO_OBJECT:-sphere} depth_pc_mode:=${MUJOCO_PC_MODE:-object} enable_depth_publisher:=true hardware_plugin:=mia_hand_mujoco/InteractiveSystemInterface;
        /bin/bash
      "

  miahand_ros2_control:
    extends: miahand_ros2
    container_name: miahand_ros2_control
    environment:
      - USE_MOCK_HARDWARE=${USE_MOCK_HARDWARE:-true}
    command: >
      bash -c "
        source install/setup.bash &&
        ros2 launch mia_hand_ros2_control mia_hand_system_interface_launch.py use_mock_hardware:=${USE_MOCK_HARDWARE:-true};
        /bin/bash
      "

  realsense_camera:
    extends: miahand_ros2
    container_name: miahand_realsense_camera
    user: "0:0"
    environment:
      HOME: /root
    entrypoint: ["/bin/bash", "-lc"]
    command: "/miahand_ws/src/docker-deployment/start_realsense_camera.sh"

  # FastRTPS discovery server for cross-network ROS communication
  discovery:
    extends: miahand_ros2
    container_name: robotlab_discovery
    command: bash -c 'source /opt/ros/jazzy/setup.bash && fast-discovery-server -i 0 -p 11811'
    ports:
      - "11811:11811/udp"
