# compose.yaml — auto-discovered entry point for both podman-compose and docker compose.
#
# Why this file exists:
#   Podman resolves the compose file from os.environ (not .env), so COMPOSE_FILE
#   in .env is read too late to affect which file is loaded.  By providing this
#   file as the default entry point (first in COMPOSE_DEFAULT_LS), we get the
#   .env loaded before the YAML content is parsed, which means ${PLATFORM_COMPOSE}
#   below IS substituted from .env correctly.
#
# Usage:
#   Linux (Podman/Docker) — no change needed, default is docker-compose.linux-podman.yml
#   Windows              — set PLATFORM_COMPOSE=docker-compose.windows.yml in .env

include:
  - ${PLATFORM_COMPOSE:-docker-compose.linux-podman.yml}
