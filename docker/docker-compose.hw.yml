# Hardware overlay — convenience alias for starting with segmentation.
#
# Usage:  make up-hw
# Behind the scenes:
#   podman-compose -f docker-compose.yml -f docker-compose.hw.yml up -d prosthesis segmentation-cpu
#
# The base docker-compose.yml already sets privileged: true, which exposes
# all host devices (including USB serial ports) to the container.
# Device identification and symlink creation is handled by:
#   scripts/setup_usb_devices.sh  (run inside the container before launch)
#
# No device mappings or group settings are needed here.

services:
    prosthesis:
        # No additional configuration needed — privileged mode in the base
        # compose already provides full device access.
        group_add:
            - "keep-groups"
