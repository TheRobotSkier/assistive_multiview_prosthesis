# Hardware override — used with:  podman-compose -f docker-compose.yml -f docker-compose.hw.yml up
#
# Adds USB device mappings and creates the /dev/ttyMiaHand symlink.
# The Makefile target 'up-hw' uses this automatically.
#
# Only map devices that are actually connected.  Podman will refuse to start
# the container if a mapped device does not exist on the host.
# Uncomment the wrist line when the Dynamixel is connected.

services:
  prosthesis:
    devices:
      # Mia Hand (FTDI serial — always required)
      - /dev/ttyUSB0:/dev/ttyUSB0
      # Wrist Dynamixel — uncomment when connected
      # - /dev/ttyUSB1:/dev/ttyUSB1
    # group_add: "keep-groups" preserves the host user's group memberships
    # (e.g. dialout) so the container user can access serial devices.
    group_add:
      - "keep-groups"
    environment:
      - DISPLAY=${DISPLAY:-:0}
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - ROS_DOMAIN_ID=0
