# Podman Compose GPU runtime override for mobile_sam_gpu
#
# Usage:
#   podman-compose -f docker-compose.yml -f docker-compose.mobile-sam.podman-gpu.yml \
#     --profile mobile-sam-gpu up -d mobile_sam_gpu
#
# Prerequisites:
#   - podman >= 4.0 with NVIDIA container device support
#   - nvidia-container-toolkit or nvidia-cdi-hook configured
#   - Host GPU driver compatible with CUDA 11.8
#   - The nvidia.com/gpu=all device must be available via CDI or libnvidia-container

services:
    mobile_sam_gpu:
        devices:
            - nvidia.com/gpu=all
        environment:
            - NVIDIA_VISIBLE_DEVICES=all
            - NVIDIA_DRIVER_CAPABILITIES=compute,utility
