version: '3.8'

services:
  wrist-test:
    build:
      context: ..
      dockerfile: docker/Dockerfile.wrist-test
    image: wrist-test:latest
    container_name: wrist-test
    privileged: true
    network_mode: host
    volumes:
      - ../logs/wrist:/wrist_ws/logs/wrist
    environment:
      - WRIST_SERIAL_PORT=${WRIST_SERIAL_PORT:-/dev/ttyUSB0}
    devices:
      - ${WRIST_SERIAL_PORT:-/dev/ttyUSB0}:${WRIST_SERIAL_PORT:-/dev/ttyUSB0}
    command: >
      bash -c "
        source /opt/ros/jazzy/setup.bash &&
        cd /wrist_ws &&
        colcon build --packages-select wrist_driver &&
        source install/setup.bash &&
        python3 /wrist_test.py --port ${WRIST_SERIAL_PORT:-/dev/ttyUSB0} --output /wrist_ws/logs/wrist/test.log
      "
