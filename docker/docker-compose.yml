# Prosthesis — Docker Compose
#
# Development workflow:
#   make dev              # start dev container (instant, source mounted as volumes)
#   make shell            # shell into container
#   make dev-shell        # start + shell in one command
#
# Inside the container (use the workspace Makefile):
#   make                  # show all available targets
#   make build            # colcon build (all packages)
#   make build-pkg PKG=x  # incremental build
#   make digital-twin     # launch digital twin
#   make mock             # launch mock pipeline
#
# Segmentation services (separate CPU and CUDA variants):
#   make segmentation-cpu   # CPU-only image (no NVIDIA dependencies)
#   make segmentation-cuda  # CUDA image with GPU support (requires NVIDIA runtime)
#   make up-hw              # start with USB device mapping
#   make test               # run smoke tests (builds production image)
#
# Container backend selection:
#   Set CONTAINER_BACKEND=docker or CONTAINER_BACKEND=podman in environment.
#   Default auto-detects podman-compose first, then docker compose.

services:
    # ── Main ROS 2 development container ──────────────────────────────────────
    # Uses the 'base' Dockerfile stage — no source copied, no colcon build.
    # Source is mounted as bind volumes; build artifacts live in named volumes.
    prosthesis:
        container_name: prosthesis
        image: prosthesis:latest
        build:
            context: ..
            dockerfile: docker/Dockerfile
            target: base
            args:
                USER_UID: ${USER_UID:-1000}
                USER_GID: ${USER_GID:-1000}
        environment:
            - DISPLAY=${DISPLAY:-:0}
            - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
            - CYCLONEDDS_URI=/tmp/cyclonedds_peer.xml
            - ROS_DOMAIN_ID=0
            - NVIDIA_VISIBLE_DEVICES=all
            - NVIDIA_DRIVER_CAPABILITIES=all
        network_mode: host
        userns_mode: "keep-id"
        volumes:
            # X11 forwarding (works on Linux and WSL2 with WSLg)
            - /tmp/.X11-unix:/tmp/.X11-unix:rw
            # CycloneDDS config (socket buffer tuning; single-machine, no peers)
            - ../config/cyclonedds_peer.xml:/tmp/cyclonedds_peer.xml:ro
            # Source directories — bind-mounted for instant edit→build cycles
            - ../src:/prosthesis_ws/src:rw
            - ../config:/prosthesis_ws/config:rw
            - ../rviz:/prosthesis_ws/rviz:rw
            - ../scripts:/prosthesis_ws/scripts:rw
            - ../tests:/prosthesis_ws/tests:rw
            # In-container Makefile
            - ../Makefile.workspace:/prosthesis_ws/Makefile:ro
            # Build artifacts — named volumes persist across container restarts
            - prosthesis-build:/prosthesis_ws/build
            - prosthesis-install:/prosthesis_ws/install
            - prosthesis-log:/prosthesis_ws/log
            # Run logs + rosbags — bind-mounted so they persist to the host
            # filesystem and survive container removal.
            - ../logs:/prosthesis_ws/logs:rw
            - ../data:/prosthesis_ws/data:rw
            # EMG training data and trained models — persist across container restarts
            - ../data:/app/data:rw
            - ../models:/app/models:rw
        privileged: true # LINUX ONLY
        ipc: host       # Share /dev/shm for RViz Qt GPU rendering
        stdin_open: true
        tty: true

    # ── Segmentation inference server — CUDA variant ──────────────────────────
    # Requires NVIDIA container runtime. Use docker-compose.segmentation.cuda.yml
    # (Docker) or docker-compose.segmentation.podman-gpu.yml (Podman) for GPU passthrough.
    segmentation-cuda:
        container_name: segmentation-cuda
        image: segmentation:cuda
        build:
            context: ../src/segmentation
            dockerfile: ../../docker/Dockerfile.segmentation
            args:
                BACKEND: cuda
        environment:
            - INFERENCE_SERVER_PORT=${INFERENCE_SERVER_PORT:-5678}
            - NVIDIA_VISIBLE_DEVICES=all
            - NVIDIA_DRIVER_CAPABILITIES=all
        command: ["/bin/bash", "-c", "exec python /nodes/inference_server.py"]
        volumes:
            - /tmp/.X11-unix:/tmp/.X11-unix:rw
            # Persist model weights across container recreations (~200MB)
            - ${HOME}/prosthesis_data/weights:/weights:rw
        network_mode: host
        restart: unless-stopped
        healthcheck:
            test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:5678/health')\""]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 120s
        profiles:
            - segmentation-cuda
        privileged: true # LINUX ONLY
        userns_mode: "keep-id" # LINUX_ONLY

    # ── Segmentation inference server — CPU variant ──────────────────────────
    # Truly CPU-only: uses ubuntu:20.04 base, CPU PyTorch wheels, and no CUDA libs.
    # Runs on any machine without NVIDIA container support.
    segmentation-cpu:
        container_name: segmentation-cpu
        image: segmentation:cpu
        build:
            context: ../src/segmentation
            dockerfile: ../../docker/Dockerfile.segmentation
            args:
                BACKEND: cpu
        environment:
            - INFERENCE_SERVER_PORT=${INFERENCE_SERVER_PORT:-5678}
        command: ["/bin/bash", "-c", "exec python /nodes/inference_server.py"]
        volumes:
            - /tmp/.X11-unix:/tmp/.X11-unix:rw
            # Persist model weights across container recreations (~200MB)
            - ${HOME}/prosthesis_data/weights:/weights:rw
        network_mode: host
        restart: unless-stopped
        healthcheck:
            test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:5678/health')\""]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 120s
        profiles:
            - segmentation-cpu
        privileged: true # LINUX ONLY
        userns_mode: "keep-id" # LINUX_ONLY

    # ── MobileSAM 2D segmentation server (V6 plan §6.4) ──────────────────────
    # Standalone Flask service — zero ROS dependencies.  Takes an RGB image +
    # 2D click, returns a dilated binary mask.  Replaces InterObject3D for the
    # 2D stage of the TSDF-fusion pipeline.
    #
    # Two variants are provided; pick the one matching your hardware:
    #   make mobile-sam-cpu   # CPU-only (runs anywhere)
    #   make mobile-sam-gpu   # CUDA (requires NVIDIA container runtime)
    #
    # The server auto-detects CUDA via torch.cuda.is_available() and loads the
    # model onto the GPU when available.  Both services listen on port 5679.

    mobile_sam_cpu:
        container_name: mobile_sam_cpu
        image: mobile_sam:cpu
        build:
            context: ..
            dockerfile: docker/Dockerfile.segmentation_v2
            args:
                DOWNLOAD_WEIGHTS: ${MOBILE_SAM_DOWNLOAD_WEIGHTS:-0}
        environment:
            - MOBILE_SAM_PORT=${MOBILE_SAM_PORT:-5679}
            - SAM_WEIGHTS=/weights/mobile_sam.pt
        volumes:
            # Persist MobileSAM weights across container recreations (~40MB)
            - ${HOME}/prosthesis_data/weights:/weights:rw
        network_mode: host
        restart: unless-stopped
        healthcheck:
            test: ["CMD-SHELL", "python -c \"import urllib.request,sys; r=urllib.request.urlopen('http://127.0.0.1:5679/health'); sys.exit(0 if r.status==200 else 1)\""]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 30s
        profiles:
            - mobile-sam-cpu
        privileged: true # LINUX ONLY
        userns_mode: "keep-id" # LINUX_ONLY

    mobile_sam_gpu:
        container_name: mobile_sam_gpu
        image: mobile_sam:gpu
        build:
            context: ..
            dockerfile: docker/Dockerfile.segmentation_v2_gpu
            args:
                DOWNLOAD_WEIGHTS: ${MOBILE_SAM_DOWNLOAD_WEIGHTS:-0}
        environment:
            - MOBILE_SAM_PORT=${MOBILE_SAM_PORT:-5679}
            - SAM_WEIGHTS=/weights/mobile_sam.pt
            - NVIDIA_VISIBLE_DEVICES=all
            - NVIDIA_DRIVER_CAPABILITIES=compute,utility
        volumes:
            - ${HOME}/prosthesis_data/weights:/weights:rw
        network_mode: host
        restart: unless-stopped
        # GPU passthrough (docker-compose native API; requires nvidia runtime).
        deploy:
            resources:
                reservations:
                    devices:
                        - driver: nvidia
                          count: all
                          capabilities: [gpu]
        healthcheck:
            test: ["CMD-SHELL", "python -c \"import urllib.request,sys; r=urllib.request.urlopen('http://127.0.0.1:5679/health'); sys.exit(0 if r.status==200 else 1)\""]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 30s
        profiles:
            - mobile-sam-gpu
        privileged: true # LINUX ONLY
        userns_mode: "keep-id" # LINUX_ONLY
    # ── Test runner: uses production image, builds + runs smoke tests, exits ────
    test:
        container_name: test
        build:
            context: ..
            dockerfile: docker/Dockerfile
            target: production
            args:
                USER_UID: ${USER_UID:-1000}
                USER_GID: ${USER_GID:-1000}
        user: ${USER_UID:-1000}:${USER_GID:-1000}
        userns_mode: "keep-id"
        environment:
            - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
            - ROS_DOMAIN_ID=0
            - GRASP_CONFIG_PATH=/prosthesis_ws/config/grasp_preshaping.yaml
        command: ["/bin/bash", "-c", ". /opt/ros/jazzy/setup.sh && colcon build --cmake-args -DCMAKE_BUILD_TYPE=Release && /prosthesis_ws/scripts/run_tests.sh"]
        profiles:
            - test
        network_mode: host
        volumes:
            - ../tests:/prosthesis_ws/tests:rw

# ── Named volumes ────────────────────────────────────────────────────────────
volumes:
    prosthesis-build:
    prosthesis-install:
    prosthesis-log:

