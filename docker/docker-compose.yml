# Prosthesis — minimal Docker Compose
# Usage:
#   make up                        # mock hardware (default)
#   make up-hw                     # real hardware (USB devices mapped)
#   make test                      # run smoke tests
#   make build                     # build all images
#
# Or directly:
#   podman-compose build
#   podman-compose up              # mock
#   podman-compose --profile hardware up

services:
  # ── Main ROS 2 container ─────────────────────────────────────────────────
  prosthesis:
    container_name: prosthesis
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        USER_UID: ${USER_UID:-1000}
        USER_GID: ${USER_GID:-1000}
    environment:
      - DISPLAY=${DISPLAY:-:0}
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - ROS_DOMAIN_ID=0
    network_mode: host
    volumes:
      # X11 forwarding (works on Linux and WSL2 with WSLg)
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    #    profiles:
    #      - mock, rviz, test
    stdin_open: true
    tty: true
    privileged: true # LINUX ONLY
    userns_mode: "keep-id" # LINUX_ONLY

  interactive:
    container_name: interactive
    extends: prosthesis
    stdin_open: true
    tty: true
    command: bash

  # RVIZ test: just verifies that rviz gui can open in default prostehsis container
  rviz:
    container_name: rviz-test
    extends: prosthesis
    command: rviz2
    profiles:
      - rviz

  # ── Hardware variant: same image with USB devices ────────────────────────
  prosthesis-hw:
    extends: prosthesis
    container_name: prosthesis-hw
    runtime: nvidia
    ipc: host
    devices:
      - ${MIA_SERIAL_PORT:-/dev/ttyUSB1}:/dev/ttyUSB1
      - ${WRIST_PORT:-/dev/ttyUSB0}:/dev/ttyUSB0
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - /dev:/dev
      - /run/udev:/run/udev:ro
    environment:
      - CAM_HEAD_SERIAL=${CAM_HEAD_SERIAL:-}
      - CAM_ARM_SERIAL=${CAM_ARM_SERIAL:-}
    profiles:
      - hardware

  # ── Segmentation inference server (Python 3.8 + MinkowskiEngine) ────────
  segmentation:
    container_name: segmentation
    build:
      context: ../src/segmentation
      dockerfile: ../../docker/Dockerfile.segmentation
    environment:
      - INFERENCE_SERVER_PORT=${INFERENCE_SERVER_PORT:-5678}
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    network_mode: host
    profiles:
      - segmentation
      - grasp_test
      - digital_twin
    privileged: true # LINUX ONLY
    userns_mode: "keep-id" # LINUX_ONLY

  # ── Grasp test: runs grasp test launch file with camera & GUI ──────────────
  grasp_test:
    container_name: grasp_test
    extends: prosthesis
    command:
      [
        "/bin/bash",
        "-c",
        "source /prosthesis_ws/install/setup.bash && ros2 launch prosthesis_launch grasp_test.launch.py camera:=true gui:=true",
      ]
    environment:
      - RMW_IMPLEMENTATION=rmw_fastrtps_cpp
      - XAUTHORITY=/tmp/.Xauthority
    network_mode: host
    volumes:
      # X11 forwarding (works on Linux and WSL2 with WSLg)
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    depends_on:
      - segmentation
    profiles:
      - grasp_test
    stdin_open: true
    tty: true
    privileged: true # LINUX ONLY
    userns_mode: "keep-id" # LINUX_ONLY

  # ── Digital twin: cameras -> pointcloud fuse -> segmentation -> preshaping -> proximity ──
  digital_twin:
    container_name: digital_twin
    extends: prosthesis
    command:
      [
        "/bin/bash",
        "-c",
        "source /prosthesis_ws/install/setup.bash && ros2 launch prosthesis_launch digital_twin.launch.py camera:=true gui:=false",
      ]
    environment:
      - RMW_IMPLEMENTATION=rmw_fastrtps_cpp
      - XAUTHORITY=/tmp/.Xauthority
    network_mode: host
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    depends_on:
      - segmentation
    profiles:
      - digital_twin
    stdin_open: true
    tty: true
    privileged: true
    userns_mode: "keep-id"

  # ── Test runner: reuses prosthesis image, runs smoke tests, exits ────────
  test:
    extends: prosthesis
    container_name: test
    user: "0:0"
    environment:
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - ROS_DOMAIN_ID=0
      - GRASP_CONFIG_PATH=/prosthesis_ws/config/grasp_preshaping.yaml
    command: ["/bin/bash", "/prosthesis_ws/scripts/run_tests.sh"]
    profiles:
      - test
    network_mode: host
