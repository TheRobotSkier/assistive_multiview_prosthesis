# Prosthesis — Docker Compose
#
# Development workflow:
#   make dev              # start dev container (instant, source mounted as volumes)
#   make shell            # shell into container
#   make dev-shell        # start + shell in one command
#
# Inside the container (use the workspace Makefile):
#   make                  # show all available targets
#   make build            # colcon build (all packages)
#   make build-pkg PKG=x  # incremental build
#   make digital-twin     # launch digital twin
#   make mock             # launch mock pipeline
#
# Segmentation services (separate CPU and CUDA variants):
#   make segmentation-cpu   # CPU-only image (no NVIDIA dependencies)
#   make segmentation-cuda  # CUDA image with GPU support (requires NVIDIA runtime)
#   make up-hw              # start with USB device mapping
#   make test               # run smoke tests (builds production image)
#
# Container backend selection:
#   Set CONTAINER_BACKEND=docker or CONTAINER_BACKEND=podman in environment.
#   Default auto-detects podman-compose first, then docker compose.

services:
    # ── Main ROS 2 development container ──────────────────────────────────────
    # Uses the 'base' Dockerfile stage — no source copied, no colcon build.
    # Source is mounted as bind volumes; build artifacts live in named volumes.
    prosthesis:
        container_name: prosthesis
        image: prosthesis:latest
        build:
            context: ..
            dockerfile: docker/Dockerfile
            target: base
            args:
                USER_UID: ${USER_UID:-1000}
                USER_GID: ${USER_GID:-1000}
        environment:
            - DISPLAY=${DISPLAY:-:0}
            - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
            - CYCLONEDDS_URI=/tmp/cyclonedds_peer.xml
            - ROS_DOMAIN_ID=0
            - NVIDIA_VISIBLE_DEVICES=all
            - NVIDIA_DRIVER_CAPABILITIES=all
        network_mode: host
        userns_mode: "keep-id"
        volumes:
            # X11 forwarding (works on Linux and WSL2 with WSLg)
            - /tmp/.X11-unix:/tmp/.X11-unix:rw
            # CycloneDDS peer config for Jetson discovery
            - ../config/cyclonedds_peer.xml:/tmp/cyclonedds_peer.xml:ro
            # Source directories — bind-mounted for instant edit→build cycles
            - ../src:/prosthesis_ws/src:rw
            - ../config:/prosthesis_ws/config:rw
            - ../rviz:/prosthesis_ws/rviz:rw
            - ../scripts:/prosthesis_ws/scripts:rw
            - ../tests:/prosthesis_ws/tests:rw
            # In-container Makefile
            - ../Makefile.workspace:/prosthesis_ws/Makefile:ro
            # Build artifacts — named volumes persist across container restarts
            - prosthesis-build:/prosthesis_ws/build
            - prosthesis-install:/prosthesis_ws/install
            - prosthesis-log:/prosthesis_ws/log
        privileged: true # LINUX ONLY
        ipc: host       # Share /dev/shm for RViz Qt GPU rendering
        stdin_open: true
        tty: true

    # ── Segmentation inference server — CUDA variant ──────────────────────────
    # Requires NVIDIA container runtime. Use docker-compose.segmentation.cuda.yml
    # (Docker) or docker-compose.segmentation.podman-gpu.yml (Podman) for GPU passthrough.
    segmentation-cuda:
        container_name: segmentation-cuda
        image: segmentation:cuda
        build:
            context: ../src/segmentation
            dockerfile: ../../docker/Dockerfile.segmentation
            args:
                BACKEND: cuda
        environment:
            - INFERENCE_SERVER_PORT=${INFERENCE_SERVER_PORT:-5678}
            - NVIDIA_VISIBLE_DEVICES=all
            - NVIDIA_DRIVER_CAPABILITIES=all
        volumes:
            - /tmp/.X11-unix:/tmp/.X11-unix:rw
            # Persist model weights across container recreations (~200MB)
            - segmentation-weights:/weights
        network_mode: host
        profiles:
            - segmentation-cuda
        privileged: true # LINUX ONLY
        userns_mode: "keep-id" # LINUX_ONLY

    # ── Segmentation inference server — CPU variant ──────────────────────────
    # Truly CPU-only: uses ubuntu:20.04 base, CPU PyTorch wheels, and no CUDA libs.
    # Runs on any machine without NVIDIA container support.
    segmentation-cpu:
        container_name: segmentation-cpu
        image: segmentation:cpu
        build:
            context: ../src/segmentation
            dockerfile: ../../docker/Dockerfile.segmentation
            args:
                BACKEND: cpu
        environment:
            - INFERENCE_SERVER_PORT=${INFERENCE_SERVER_PORT:-5678}
        volumes:
            - /tmp/.X11-unix:/tmp/.X11-unix:rw
            # Persist model weights across container recreations (~200MB)
            - segmentation-weights:/weights
        network_mode: host
        profiles:
            - segmentation-cpu
        privileged: true # LINUX ONLY
        userns_mode: "keep-id" # LINUX_ONLY

    # ── Test runner: uses production image, builds + runs smoke tests, exits ────
    test:
        container_name: test
        build:
            context: ..
            dockerfile: docker/Dockerfile
            target: production
            args:
                USER_UID: ${USER_UID:-1000}
                USER_GID: ${USER_GID:-1000}
        user: ${USER_UID:-1000}:${USER_GID:-1000}
        userns_mode: "keep-id"
        environment:
            - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
            - ROS_DOMAIN_ID=0
            - GRASP_CONFIG_PATH=/prosthesis_ws/config/grasp_preshaping.yaml
        command: ["/bin/bash", "-c", ". /opt/ros/jazzy/setup.sh && colcon build --cmake-args -DCMAKE_BUILD_TYPE=Release && /prosthesis_ws/scripts/run_tests.sh"]
        profiles:
            - test
        network_mode: host
        volumes:
            - ../tests:/prosthesis_ws/tests:rw

# ── Named volumes ────────────────────────────────────────────────────────────
volumes:
    prosthesis-build:
    prosthesis-install:
    prosthesis-log:
    segmentation-weights:
